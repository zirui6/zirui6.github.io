<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 · 页面未找到</title>
  <style>
    /* 重置 & 原生系统感 —— 极简、等宽、高对比度 */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #0d0d0d;       /* 接近终端深色背景 */
      font-family: 'Courier New', Courier, 'Lucida Sans Typewriter', monospace;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1.5rem;
      line-height: 1.5;
      color: #c0c0c0;                  /* 柔和的灰白，不是纯白，更像终端 */
    }

    /* 主容器：模仿系统内置错误页的卡片，带边框和阴影，像终端或日志窗口 */
    .error-container {
      max-width: 820px;
      width: 100%;
      background-color: #0a0a0a;        /* 比背景稍亮一点的深色块 */
      border: 1px solid #2a2a2a;        /* 极细的边框，类似日志边框 */
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.8), 0 0 0 1px #1f1f1f inset;
      padding: 2rem 2rem 2.2rem;
      border-radius: 0;                 /* 直角，更硬朗，像系统原生控件 */
      transition: all 0.1s ease;
    }

    /* 标题区 —— 模仿系统报错头部 */
    .error-header {
      display: flex;
      align-items: baseline;
      flex-wrap: wrap;
      gap: 0.5rem 0.75rem;
      border-bottom: 1px solid #2e2e2e;
      padding-bottom: 0.9rem;
      margin-bottom: 1.8rem;
    }

    .error-code {
      font-size: 2.6rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: #e0e0e0;                  /* 亮灰，标题突出 */
      line-height: 1.1;
      text-shadow: 0 0 5px rgba(255, 255, 255, 0.05);
    }

    .error-title {
      font-size: 1.6rem;
      font-weight: 500;
      color: #a0a0a0;                 /* 次级灰 */
      line-height: 1.2;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .error-sub {
      font-size: 0.9rem;
      color: #6a6a6a;
      margin-left: auto;
      padding-left: 1rem;
      border-left: 1px solid #2e2e2e;
      font-weight: 400;
      white-space: nowrap;
    }

    /* 详细信息块 —— 像系统输出的诊断信息 */
    .error-details {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      margin-bottom: 2.2rem;
    }

    .detail-row {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      font-size: 1.05rem;
      border-left: 3px solid #2a2a2a;   /* 左侧强调线，像日志标记 */
      padding-left: 1.2rem;
      transition: border-color 0.2s;
    }

    .detail-row:hover {
      border-left-color: #555;
    }

    .detail-label {
      width: 7rem;
      flex-shrink: 0;
      color: #7a7a7a;
      text-transform: uppercase;
      font-size: 0.85rem;
      letter-spacing: 0.5px;
      font-weight: 500;
    }

    .detail-value {
      color: #b0b0b0;
      font-weight: 400;
      word-break: break-word;
    }

    .detail-value.highlight {
      color: #d0d0d0;
      background-color: #1a1a1a;
      padding: 0.1rem 0.5rem;
      border-radius: 2px;
      font-size: 0.95rem;
      border: 1px solid #2c2c2c;
    }

    /* 原生分割线 —— 模仿系统分隔线 */
    .divider {
      height: 1px;
      background: repeating-linear-gradient(90deg, #2e2e2e, #2e2e2e 6px, transparent 6px, transparent 12px);
      margin: 1.5rem 0 1.2rem;
    }

    /* 建议/操作区域，像系统提示 */
    .error-hint {
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
      margin-bottom: 2rem;
      font-size: 0.98rem;
    }

    .hint-line {
      display: flex;
      align-items: flex-start;
      gap: 0.6rem;
      color: #9a9a9a;
    }

    .hint-line::before {
      content: "▸";
      color: #5a5a5a;
      font-weight: 700;
      display: inline-block;
      width: 1.2rem;
      flex-shrink: 0;
      font-size: 1.1rem;
      line-height: 1.3;
    }

    /* 操作按钮 —— 模仿系统原生按钮（极简、直角、hover反色） */
    .action-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      margin-top: 2rem;
      border-top: 1px solid #262626;
      padding-top: 1.8rem;
    }

    .btn {
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 500;
      padding: 0.7rem 1.6rem;
      background: #111;
      color: #b0b0b0;
      border: 1px solid #3a3a3a;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      letter-spacing: 0.3px;
      transition: all 0.15s ease;
      border-radius: 2px;
      text-transform: uppercase;
      min-width: 120px;
    }

    .btn:hover {
      background: #1e1e1e;
      color: #e0e0e0;
      border-color: #5a5a5a;
      box-shadow: 0 0 8px rgba(255, 255, 255, 0.03);
    }

    .btn:active {
      background: #2a2a2a;
      transform: translateY(1px);
      border-color: #7a7a7a;
      color: #ffffff;
    }

    .btn-secondary {
      background: transparent;
      border-color: #2e2e2e;
      color: #7a7a7a;
    }

    .btn-secondary:hover {
      background: #151515;
      border-color: #4a4a4a;
      color: #b0b0b0;
    }

    /* 底部系统风格的签名/版本 */
    .system-footer {
      margin-top: 1.5rem;
      display: flex;
      justify-content: space-between;
      font-size: 0.72rem;
      color: #4a4a4a;
      text-transform: uppercase;
      letter-spacing: 0.3px;
      border-top: 1px solid #1e1e1e;
      padding-top: 1rem;
      font-weight: 400;
    }

    .system-footer span {
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    /* 响应式小调整 */
    @media (max-width: 600px) {
      .error-container {
        padding: 1.5rem 1.2rem 1.8rem;
      }

      .error-header {
        flex-direction: column;
        align-items: flex-start;
        gap: 0.3rem;
      }

      .error-code {
        font-size: 2.2rem;
      }

      .error-title {
        font-size: 1.2rem;
      }

      .error-sub {
        margin-left: 0;
        padding-left: 0;
        border-left: none;
        font-size: 0.8rem;
      }

      .detail-row {
        flex-direction: column;
        gap: 0.2rem;
        padding-left: 0.9rem;
      }

      .detail-label {
        width: auto;
        font-size: 0.75rem;
      }

      .action-bar {
        flex-direction: column;
      }

      .btn {
        width: 100%;
      }

      .system-footer {
        flex-direction: column;
        gap: 0.4rem;
      }
    }
  </style>
</head>
<body>
  <div class="error-container">
    <!-- 头部：404 + 标题 + 附加标识 -->
    <div class="error-header">
      <span class="error-code">404</span>
      <span class="error-title">Not Found</span>
      <span class="error-sub">你访问的资源缺失了</span>
    </div>

    <!-- 诊断详情：模仿内核/服务器输出的错误详情 -->
    <div class="error-details">
      <div class="detail-row">
        <span class="detail-label">错误代码</span>
        <span class="detail-value highlight">HTTP 404 · 未找到</span>
      </div>
      <div class="detail-row">
        <span class="detail-label">请求路径</span>
        <span class="detail-value" id="requestPath">/api/v1/resource/undefined</span>
      </div>
      <div class="detail-row">
        <span class="detail-label">错误来源</span>
        <span class="detail-value">web-server (nginx/1.24.0)</span>
      </div>
      <div class="detail-row">
        <span class="detail-label">时间戳</span>
        <span class="detail-value" id="timestamp">2025-04-09 15:32:18 UTC</span>
      </div>
    </div>

    <!-- 原生分割线 -->
    <div class="divider" aria-hidden="true"></div>

    <!-- 系统级的建议 / 提示信息 -->
    <div class="error-hint">
      <div class="hint-line">请求的页面已被移除、重命名或暂时不可用。</div>
      <div class="hint-line">请检查 URL 拼写是否正确，或联系系统管理员。</div>
      <div class="hint-line">错误标识：<span style="color:#6f6f6f; background:#1a1a1a; padding:0.1rem 0.5rem; border-radius:2px;">ERR_404_NOT_FOUND</span></div>
    </div>

    <!-- 操作按钮 —— 原生系统风格按钮，返回首页 / 重试 -->
    <div class="action-bar">
      <a href="#" class="btn" id="homeBtn" onclick="event.preventDefault(); window.location.href='/';">返回首页</a>
      <button class="btn btn-secondary" id="retryBtn" onclick="window.location.reload();">重试请求</button>
      <button class="btn btn-secondary" id="backBtn" onclick="window.history.back();">返回上一页</button>
    </div>

    <!-- 底部签名，像系统命令的输出尾 -->
    <div class="system-footer">
      <span>⎯ system/404 · 原生错误页 ⎯</span>
      <span>node: unknown · pid: 1024</span>
    </div>
  </div>

  <script>
    (function() {
      // 让页面中的请求路径和时间戳更真实 —— 根据当前地址栏动态变化
      // 1. 请求路径：显示当前路径或一个典型的不存在的路径 (让模拟感更强)
      const pathElement = document.getElementById('requestPath');
      if (pathElement) {
        // 如果当前 url 不是典型的 404 测试路径，则显示一个“模拟”路径。
        // 但为保持看起来像系统原生，也可以用当前 pathname 加一些迷惑后缀。
        const currentPath = window.location.pathname;
        // 如果当前路径是 /404 或 /not-found 等等，就展示出来；否则构造一个看起来是系统资源缺失的路径。
        if (currentPath && currentPath !== '/' && !currentPath.includes('index.html')) {
          // 显示当前路径，但添加一个可能不存在的参数，更像系统捕捉到的请求
          pathElement.textContent = currentPath + (currentPath.endsWith('/') ? '' : '/') + 'resource';
        } else {
          // 否则显示一个典型的内核请求路径 (让它看起来更真实)
          pathElement.textContent = '/api/v1/resource/undefined';
        }
      }

      // 2. 时间戳: 格式化为 "YYYY-MM-DD HH:mm:ss UTC"
      const timestampElement = document.getElementById('timestamp');
      if (timestampElement) {
        const now = new Date();
        const year = now.getUTCFullYear();
        const month = String(now.getUTCMonth() + 1).padStart(2, '0');
        const day = String(now.getUTCDate()).padStart(2, '0');
        const hours = String(now.getUTCHours()).padStart(2, '0');
        const minutes = String(now.getUTCMinutes()).padStart(2, '0');
        const seconds = String(now.getUTCSeconds()).padStart(2, '0');
        timestampElement.textContent = `${year}-${month}-${day} ${hours}:${minutes}:${seconds} UTC`;
      }

      // 3. 按钮点击时轻微的控制台报错风格反馈 (只是为了增加原生感，不影响使用)
      const homeBtn = document.getElementById('homeBtn');
      const retryBtn = document.getElementById('retryBtn');
      const backBtn = document.getElementById('backBtn');

      // 控制台打印系统风格的错误日志 (只是装饰)
      console.log('%c[404] 错误页已加载', 'color: #888; font-family: monospace; background: #0a0a0a; padding: 2px 6px; border-left: 3px solid #555;');
      console.log('%c  ⎯ 请求的资源不存在 ⎯', 'color: #666; font-family: monospace;');

      // 为返回首页增加一个确认? 不需要，但添加一个控制台信息来模拟系统日志
      if (homeBtn) {
        homeBtn.addEventListener('click', function(e) {
          console.log('%c[INFO] 用户重定向至首页 /', 'color: #7a7a7a; font-family: monospace;');
        });
      }

      if (retryBtn) {
        retryBtn.addEventListener('click', function() {
          console.log('%c[RETRY] 重新加载当前页面', 'color: #7a7a7a; font-family: monospace;');
        });
      }

      if (backBtn) {
        backBtn.addEventListener('click', function() {
          console.log('%c[NAV] 尝试返回上一页', 'color: #7a7a7a; font-family: monospace;');
        });
      }

      // 可选: 如果用户点击重试或返回，不拦截默认行为 (它们本来就是标准行为)
      // 但重试按钮已经绑定了window.location.reload，没问题。
      // 返回上一页按钮使用 window.history.back()
      // 为 backBtn 绑定更明确的行为 (以防某些浏览器内联onclick失效)
      if (backBtn) {
        backBtn.onclick = function(e) {
          e.preventDefault();
          window.history.back();
        };
      }

      // 重试按钮绑定 reload (也可以用内联方式，这里用事件监听代替内联，更干净)
      if (retryBtn) {
        retryBtn.onclick = function(e) {
          e.preventDefault();
          window.location.reload();
        };
      }

      // homeBtn 已经使用内联onclick，但为了规范，覆盖一下
      if (homeBtn) {
        homeBtn.onclick = function(e) {
          e.preventDefault();
          window.location.href = '/';
        };
      }
    })();
  </script>
</body>
</html>
