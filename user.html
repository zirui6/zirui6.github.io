<!DOCTYPE html>
<html lang="zh-CN" id="htmlRoot">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>用户中心 · 梓睿</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-body: #eef2f7;
            --bg-card: #ffffff;
            --text-primary: #0b1a2e;
            --text-secondary: #2c3e5a;
            --text-muted: #6b7f96;
            --border-color: #dce3ed;
            --shadow-lg: 0 20px 64px rgba(11, 26, 46, 0.12);
            --shadow-md: 0 4px 20px rgba(11, 26, 46, 0.08);
            --accent: #1a4b8c;
            --accent-light: rgba(26, 75, 140, 0.08);
            --radius-md: 14px;
            --radius-lg: 20px;
            --transition: 0.3s ease;
            --font: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
        }

        [data-theme="dark"] {
            --bg-body: #0a1628;
            --bg-card: #111d33;
            --text-primary: #e8edf4;
            --text-secondary: #a8b9d0;
            --text-muted: #6b7f96;
            --border-color: #1e3350;
            --shadow-lg: 0 20px 64px rgba(0, 0, 0, 0.5);
            --shadow-md: 0 4px 20px rgba(0, 0, 0, 0.3);
            --accent: #4a8fd8;
            --accent-light: rgba(74, 143, 216, 0.12);
        }

        body {
            font-family: var(--font);
            background: var(--bg-body);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
            transition: background var(--transition);
        }

        .user-container {
            background: var(--bg-card);
            border-radius: var(--radius-lg);
            padding: 44px 40px 36px;
            max-width: 560px;
            width: 100%;
            box-shadow: var(--shadow-lg);
            border: 1px solid var(--border-color);
            transition: background var(--transition), border-color var(--transition);
        }

        .user-header {
            text-align: center;
            margin-bottom: 28px;
        }

        .user-header .logo-img {
            max-width: 120px;
            height: auto;
            display: block;
            margin: 0 auto 10px;
            border-radius: 16px;
        }

        .user-header h1 {
            font-size: 24px;
            color: var(--text-primary);
        }

        .user-header p {
            color: var(--text-muted);
            font-size: 14px;
            margin-top: 2px;
        }

        /* ===== 快捷入口 ===== */
        .quick-entry {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 20px;
        }

        .quick-entry .entry-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px 16px;
            background: var(--bg-body);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            color: var(--text-primary);
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
            transition: all var(--transition);
            cursor: pointer;
        }

        .quick-entry .entry-btn:hover {
            border-color: var(--accent);
            background: var(--accent-light);
            transform: translateY(-1px);
        }

        .quick-entry .entry-btn .emoji {
            font-size: 20px;
        }

        /* ===== 消息提示 ===== */
        .msg {
            padding: 12px 16px;
            border-radius: var(--radius-md);
            font-size: 14px;
            margin-bottom: 16px;
            display: none;
            line-height: 1.6;
        }

        .msg.error {
            display: block;
            background: #fde8e8;
            color: #c62828;
            border: 1px solid #f5c6c6;
        }

        .msg.success {
            display: block;
            background: #e8f5e9;
            color: #2e7d32;
            border: 1px solid #c8e6c9;
        }

        .msg.info {
            display: block;
            background: #e3f2fd;
            color: #0d47a1;
            border: 1px solid #bbdefb;
        }

        .msg.warning {
            display: block;
            background: #fff3cd;
            color: #856404;
            border: 1px solid #ffc107;
        }

        [data-theme="dark"] .msg.error {
            background: #2d1a1a;
            color: #ef9a9a;
            border-color: #4a2a2a;
        }

        [data-theme="dark"] .msg.success {
            background: #1a2d1a;
            color: #81c784;
            border-color: #2a4a2a;
        }

        [data-theme="dark"] .msg.info {
            background: #1a2a3d;
            color: #90caf9;
            border-color: #2a4a6a;
        }

        [data-theme="dark"] .msg.warning {
            background: #2d2a1a;
            color: #ffd700;
            border-color: #ffc107;
        }

        /* ===== 头像区域 ===== */
        .avatar-section {
            text-align: center;
            margin-bottom: 24px;
        }

        .avatar-wrapper {
            position: relative;
            display: inline-block;
        }

        .avatar-wrapper img {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid var(--border-color);
            transition: border-color var(--transition);
        }

        .avatar-wrapper .avatar-edit-btn {
            position: absolute;
            bottom: 0;
            right: 0;
            background: var(--accent);
            color: #fff;
            border: none;
            border-radius: 50%;
            width: 32px;
            height: 32px;
            font-size: 14px;
            cursor: pointer;
            transition: all var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .avatar-wrapper .avatar-edit-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 2px 12px rgba(26, 75, 140, 0.3);
        }

        .avatar-wrapper .avatar-edit-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .avatar-hint {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 6px;
        }

        /* ===== 信息卡片 ===== */
        .info-card {
            background: var(--bg-body);
            border-radius: var(--radius-md);
            padding: 16px 20px;
            margin-bottom: 18px;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid var(--border-color);
        }

        .info-row:last-child {
            border-bottom: none;
        }

        .info-row .label {
            color: var(--text-muted);
            font-size: 14px;
        }

        .info-row .value {
            color: var(--text-primary);
            font-size: 14px;
            font-weight: 500;
            text-align: right;
            max-width: 60%;
            word-break: break-all;
        }

        /* ===== 编辑表单 ===== */
        .edit-section {
            margin-bottom: 18px;
        }

        .edit-section .edit-title {
            font-size: 15px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .edit-section .edit-title .toggle-edit {
            font-size: 13px;
            font-weight: 400;
            color: var(--accent);
            cursor: pointer;
            background: none;
            border: none;
            padding: 2px 10px;
            border-radius: 4px;
            transition: all var(--transition);
        }

        .edit-section .edit-title .toggle-edit:hover {
            background: var(--accent-light);
        }

        .edit-form {
            display: none;
            padding: 12px 0;
            border-top: 1px solid var(--border-color);
            margin-top: 8px;
        }

        .edit-form.show {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .edit-form .form-group {
            margin-bottom: 12px;
        }

        .edit-form .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 4px;
        }

        .edit-form .form-group input {
            width: 100%;
            padding: 10px 14px;
            border: 2px solid var(--border-color);
            border-radius: var(--radius-md);
            font-size: 14px;
            background: var(--bg-body);
            color: var(--text-primary);
            transition: all var(--transition);
            outline: none;
        }

        .edit-form .form-group input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 4px var(--accent-light);
            background: var(--bg-card);
        }

        .edit-form .form-group .hint {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 3px;
        }

        .edit-form .form-actions {
            display: flex;
            gap: 10px;
            margin-top: 4px;
        }

        .edit-form .form-actions .btn-save {
            padding: 8px 28px;
            background: linear-gradient(135deg, #1a4b8c, #2c6ba8);
            color: #fff;
            border: none;
            border-radius: var(--radius-md);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all var(--transition);
        }

        .edit-form .form-actions .btn-save:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 16px rgba(26, 75, 140, 0.3);
        }

        .edit-form .form-actions .btn-save:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .edit-form .form-actions .btn-cancel {
            padding: 8px 20px;
            background: transparent;
            color: var(--text-muted);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all var(--transition);
        }

        .edit-form .form-actions .btn-cancel:hover {
            border-color: var(--text-muted);
            color: var(--text-primary);
        }

        /* ===== 操作按钮 ===== */
        .action-buttons {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 6px;
        }

        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: var(--radius-md);
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all var(--transition);
        }

        .btn-primary {
            background: linear-gradient(135deg, #1a4b8c, #2c6ba8);
            color: #fff;
        }

        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 20px rgba(26, 75, 140, 0.30);
        }

        .btn-danger {
            background: #dc3545;
            color: #fff;
        }

        .btn-danger:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 20px rgba(220, 53, 69, 0.30);
        }

        .btn-outline {
            background: transparent;
            color: var(--text-secondary);
            border: 2px solid var(--border-color);
        }

        .btn-outline:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none !important;
        }

        .btn-chat {
            background: #4a6cf7;
            color: #fff;
        }

        .btn-chat:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 20px rgba(74, 108, 247, 0.30);
        }

        .footer-links {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
            padding-top: 16px;
            border-top: 1px solid var(--border-color);
            font-size: 13px;
        }

        .footer-links a {
            color: var(--text-muted);
            text-decoration: none;
            transition: color var(--transition);
        }

        .footer-links a:hover {
            color: var(--accent);
        }

        .loading {
            text-align: center;
            padding: 40px 0;
            color: var(--text-muted);
        }

        .loading .spinner {
            display: inline-block;
            width: 40px;
            height: 40px;
            border: 4px solid var(--border-color);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 12px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        @media (max-width: 480px) {
            .user-container {
                padding: 24px 16px 20px;
            }
            .info-row {
                flex-direction: column;
                gap: 2px;
            }
            .info-row .value {
                text-align: left;
                max-width: 100%;
            }
            .edit-form .form-actions {
                flex-direction: column;
            }
            .quick-entry {
                grid-template-columns: 1fr 1fr;
            }
        }
    </style>
</head>
<body>

    <div class="user-container" id="app">

        <!-- 头部 -->
        <div class="user-header">
            <img src="https://zirui6.github.io/logo1.png" alt="梓睿官网 Logo" class="logo-img" />
            <h1>👤 用户中心</h1>
            <p>管理你的账号信息</p>
        </div>

        <!-- 快捷入口 -->
        <div class="quick-entry">
            <a href="chat/index.html" class="entry-btn">
                <span class="emoji">💬</span> 聊天
            </a>
            <a href="cloud.html" class="entry-btn">
                <span class="emoji">📁</span> 云盘
            </a>
            <a href="index.html" class="entry-btn">
                <span class="emoji">🏠</span> 首页
            </a>
            <a href="dashboard.html" class="entry-btn">
                <span class="emoji">📊</span> 管理
            </a>
        </div>

        <!-- 消息提示 -->
        <div class="msg" id="msg"></div>

        <!-- 加载状态 -->
        <div id="loadingState" class="loading">
            <div class="spinner"></div>
            <p>加载用户信息...</p>
        </div>

        <!-- 用户内容 -->
        <div id="userContent" style="display:none;">

            <!-- 头像 -->
            <div class="avatar-section">
                <div class="avatar-wrapper">
                    <img id="userAvatar" src="https://zirui6.github.io/touxiang.jpg" alt="用户头像" />
                    <button class="avatar-edit-btn" id="avatarEditBtn">
                        📷
                    </button>
                </div>
                <div class="avatar-hint" id="avatarHint">点击 📷 更换头像（支持 JPG/PNG，最大 5MB）</div>
                <input type="file" id="avatarInput" accept="image/*" style="display:none;" />
            </div>

            <!-- 用户信息 -->
            <div class="info-card">
                <div class="info-row">
                    <span class="label">🆔 用户ID</span>
                    <span class="value" id="userId">-</span>
                </div>
                <div class="info-row">
                    <span class="label">👤 用户名</span>
                    <span class="value" id="userName">-</span>
                </div>
                <div class="info-row">
                    <span class="label">📧 邮箱</span>
                    <span class="value" id="userEmail">-</span>
                </div>
                <div class="info-row">
                    <span class="label">📅 注册时间</span>
                    <span class="value" id="userCreatedAt">-</span>
                </div>
                <div class="info-row">
                    <span class="label">🔑 登录状态</span>
                    <span class="value" id="loginStatus" style="color: #4caf50;">✅ 已登录</span>
                </div>
            </div>

            <!-- 编辑信息 -->
            <div class="edit-section">
                <div class="edit-title">
                    ✏️ 编辑资料
                    <button class="toggle-edit" id="toggleEditBtn">展开</button>
                </div>
                <div class="edit-form" id="editForm">
                    <div class="form-group">
                        <label for="editUsername">用户名</label>
                        <input type="text" id="editUsername" placeholder="请输入新用户名" />
                        <div class="hint">字母和数字组合，至少2个字符</div>
                    </div>
                    <div class="form-group">
                        <label for="editEmail">邮箱</label>
                        <input type="email" id="editEmail" placeholder="请输入新邮箱" />
                        <div class="hint">修改邮箱需要验证码确认</div>
                    </div>
                    <div class="form-group" id="verifyCodeGroup" style="display:none;">
                        <label for="editVerifyCode">验证码</label>
                        <div style="display:flex;gap:8px;">
                            <input type="text" id="editVerifyCode" placeholder="请输入6位验证码" style="flex:1;" maxlength="6" />
                            <button id="sendVerifyCodeBtn" style="padding:10px 16px;background:var(--accent);color:#fff;border:none;border-radius:var(--radius-md);font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;">发送验证码</button>
                        </div>
                        <div class="hint">验证码将发送到新邮箱，有效期10分钟</div>
                    </div>
                    <div class="form-group">
                        <label for="editPassword">新密码</label>
                        <input type="password" id="editPassword" placeholder="留空则不修改" minlength="6" />
                        <div class="hint">至少6位，留空则不修改</div>
                    </div>
                    <div class="form-actions">
                        <button class="btn-save" id="saveEditBtn">💾 保存修改</button>
                        <button class="btn-cancel" id="cancelEditBtn">取消</button>
                    </div>
                </div>
            </div>

            <!-- 操作按钮 -->
            <div class="action-buttons">
                <button class="btn btn-primary" id="refreshBtn">🔄 刷新用户信息</button>
                <button class="btn btn-chat" onclick="window.location.href='chat/index.html'">💬 聊天</button>
                <button class="btn btn-danger" id="logoutBtn">🚪 退出登录</button>
                <button class="btn btn-danger" id="deleteAccountBtn" style="background:#8b0000;color:#fff;border:2px solid #8b0000;">🗑️ 注销账号</button>
                <button class="btn btn-outline" id="backHomeBtn">🏠 返回首页</button>
            </div>
        </div>

        <!-- 底部链接 -->
        <div class="footer-links">
            <a href="login.html">登录页面</a>
            <a href="index.html">首页</a>
            <a href="dashboard.html">管理后台</a>
            <a href="zirui6.github.io/chat/index.html">聊天</a>
        </div>

    </div>

    <script>
        // ============================================================
        // 配置
        // ============================================================
        var API_BASE = 'https://webcloud.ziruicloud.de5.net';

        // 白名单邮箱（无需验证）
        var WHITELIST_EMAILS = ['test@test.com', 'admin@qq.com'];

        function isWhitelisted(email) {
            return WHITELIST_EMAILS.indexOf(email.toLowerCase()) !== -1;
        }

        // ============================================================
        // Cookie 工具
        // ============================================================
        var CookieHelper = {
            set: function(name, value, days) {
                var expires = '';
                if (days) {
                    var date = new Date();
                    date.setTime(date.getTime() + (days * 24 * 60 * 60 * 1000));
                    expires = '; expires=' + date.toUTCString();
                }
                document.cookie = name + '=' + encodeURIComponent(value) + expires + '; path=/; SameSite=Lax';
            },
            get: function(name) {
                var nameEQ = name + '=';
                var ca = document.cookie.split(';');
                for (var i = 0; i < ca.length; i++) {
                    var c = ca[i];
                    while (c.charAt(0) === ' ') c = c.substring(1, c.length);
                    if (c.indexOf(nameEQ) === 0) {
                        return decodeURIComponent(c.substring(nameEQ.length, c.length));
                    }
                }
                return null;
            },
            delete: function(name) {
                document.cookie = name + '=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;';
            }
        };

        // ============================================================
        // DOM 引用
        // ============================================================
        var msgEl = document.getElementById('msg');
        var loadingState = document.getElementById('loadingState');
        var userContent = document.getElementById('userContent');

        var userIdEl = document.getElementById('userId');
        var userNameEl = document.getElementById('userName');
        var userEmailEl = document.getElementById('userEmail');
        var userCreatedAtEl = document.getElementById('userCreatedAt');
        var userAvatarEl = document.getElementById('userAvatar');

        var refreshBtn = document.getElementById('refreshBtn');
        var logoutBtn = document.getElementById('logoutBtn');
        var backHomeBtn = document.getElementById('backHomeBtn');
        var avatarEditBtn = document.getElementById('avatarEditBtn');
        var avatarInput = document.getElementById('avatarInput');
        var avatarHint = document.getElementById('avatarHint');

        // 编辑相关
        var toggleEditBtn = document.getElementById('toggleEditBtn');
        var editForm = document.getElementById('editForm');
        var editUsername = document.getElementById('editUsername');
        var editEmail = document.getElementById('editEmail');
        var editPassword = document.getElementById('editPassword');
        var editVerifyCode = document.getElementById('editVerifyCode');
        var verifyCodeGroup = document.getElementById('verifyCodeGroup');
        var sendVerifyCodeBtn = document.getElementById('sendVerifyCodeBtn');
        var saveEditBtn = document.getElementById('saveEditBtn');
        var cancelEditBtn = document.getElementById('cancelEditBtn');
        var deleteAccountBtn = document.getElementById('deleteAccountBtn');

        var currentUser = null;
        var isEditing = false;

        // ============================================================
        // 消息系统
        // ============================================================
        function showError(title, detail) {
            msgEl.innerHTML = '<strong>❌ ' + title + '</strong><br>' + detail;
            msgEl.className = 'msg error';
        }

        function showSuccess(text) {
            msgEl.textContent = '✅ ' + text;
            msgEl.className = 'msg success';
        }

        function showInfo(text) {
            msgEl.textContent = 'ℹ️ ' + text;
            msgEl.className = 'msg info';
        }

        function showWarning(text) {
            msgEl.textContent = '⚠️ ' + text;
            msgEl.className = 'msg warning';
        }

        function hideMsg() {
            msgEl.className = 'msg';
            msgEl.textContent = '';
        }

        // ============================================================
        // 工具函数
        // ============================================================
        function getToken() {
            return sessionStorage.getItem('auth_token') || CookieHelper.get('auth_token');
        }

        function formatDate(dateStr) {
            if (!dateStr) return '-';
            var d = new Date(dateStr);
            return d.toLocaleString('zh-CN', {
                year: 'numeric',
                month: '2-digit',
                day: '2-digit',
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        function isEmail(value) {
            return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value);
        }

        // ============================================================
        // 加载用户信息
        // ============================================================
        async function loadUserInfo() {
            hideMsg();
            loadingState.style.display = 'block';
            userContent.style.display = 'none';

            var token = getToken();

            if (!token) {
                loadingState.style.display = 'none';
                showError('未登录', '请先登录再访问用户中心');
                setTimeout(function() {
                    window.location.href = 'login.html';
                }, 2000);
                return;
            }

            try {
                var response = await fetch(API_BASE + '/api/verify', {
                    headers: {
                        'Authorization': 'Bearer ' + token
                    }
                });

                var data = await response.json();

                if (data.valid && data.user) {
                    currentUser = data.user;

                    userIdEl.textContent = data.user.id || '-';
                    userNameEl.textContent = data.user.username || '-';
                    userEmailEl.textContent = data.user.email || '-';
                    userCreatedAtEl.textContent = formatDate(data.user.created_at) || '-';

                    if (data.user.avatar_url) {
                        userAvatarEl.src = data.user.avatar_url;
                    }

                    sessionStorage.setItem('user_data', JSON.stringify(data.user));

                    loadingState.style.display = 'none';
                    userContent.style.display = 'block';

                    editUsername.value = data.user.username || '';
                    editEmail.value = data.user.email || '';

                    showSuccess('用户信息加载成功');
                } else {
                    loadingState.style.display = 'none';
                    showError('会话过期', '请重新登录');
                    clearUserSession();
                    setTimeout(function() {
                        window.location.href = 'login.html';
                    }, 2000);
                }
            } catch (error) {
                console.error('加载用户信息失败:', error);
                loadingState.style.display = 'none';
                showError('网络错误', error.message || '无法加载用户信息');

                var cachedUser = sessionStorage.getItem('user_data');
                if (cachedUser) {
                    try {
                        var user = JSON.parse(cachedUser);
                        currentUser = user;
                        userIdEl.textContent = user.id || '-';
                        userNameEl.textContent = user.username || '-';
                        userEmailEl.textContent = user.email || '-';
                        userCreatedAtEl.textContent = formatDate(user.created_at) || '-';
                        userContent.style.display = 'block';
                        showInfo('显示缓存数据（网络异常）');
                    } catch (e) {}
                }
            }
        }

        // ============================================================
        // 退出登录
        // ============================================================
        function clearUserSession() {
            sessionStorage.clear();
            CookieHelper.delete('auth_token');
            CookieHelper.delete('user_data');
            CookieHelper.delete('isLoggedIn');
            CookieHelper.delete('userId');
            CookieHelper.delete('userEmail');
            CookieHelper.delete('displayName');
            CookieHelper.delete('role');
        }

        function logout() {
            if (confirm('确定要退出登录吗？')) {
                clearUserSession();
                showSuccess('已退出登录，正在跳转...');
                setTimeout(function() {
                    window.location.href = 'login.html';
                }, 1500);
            }
        }

        // ============================================================
        // 注销账号
        // ============================================================
        deleteAccountBtn.addEventListener('click', async function() {
            if (!confirm('⚠️ 确定要注销账号吗？\n\n此操作将永久删除你的账号和所有数据，不可恢复！')) {
                return;
            }

            var username = currentUser?.username || '';
            var confirmName = prompt('请输入你的用户名以确认注销：\n（输入 "' + username + '" 确认）');
            if (confirmName !== username) {
                showError('用户名不匹配', '注销已取消');
                return;
            }

            if (!confirm('⚠️ 最后一次确认：确定要永久删除账号 "' + username + '" 吗？')) {
                return;
            }

            this.disabled = true;
            this.textContent = '⏳ 处理中...';

            var token = getToken();
            if (!token) {
                showError('未登录', '请重新登录');
                this.disabled = false;
                this.textContent = '🗑️ 注销账号';
                return;
            }

            try {
                var response = await fetch(API_BASE + '/api/delete-account', {
                    method: 'DELETE',
                    headers: {
                        'Authorization': 'Bearer ' + token,
                        'Content-Type': 'application/json'
                    }
                });

                var data = await response.json();

                if (response.ok && data.success) {
                    showSuccess('✅ 账号已成功注销');
                    clearUserSession();
                    setTimeout(function() {
                        window.location.href = 'login.html';
                    }, 1500);
                } else {
                    showError('注销失败', data.error || '请稍后重试');
                    this.disabled = false;
                    this.textContent = '🗑️ 注销账号';
                }
            } catch (error) {
                console.error('注销错误:', error);
                showError('网络错误', error.message || '无法连接到服务器');
                this.disabled = false;
                this.textContent = '🗑️ 注销账号';
            }
        });

        // ============================================================
        // 头像上传
        // ============================================================
        avatarEditBtn.addEventListener('click', function() {
            avatarInput.click();
        });

        avatarInput.addEventListener('change', async function(event) {
            var file = event.target.files[0];
            if (!file) return;

            var validTypes = ['image/jpeg', 'image/png', 'image/gif', 'image/webp'];
            if (!validTypes.includes(file.type)) {
                showError('格式错误', '请上传 JPG、PNG、GIF 或 WebP 格式的图片');
                return;
            }

            if (file.size > 5 * 1024 * 1024) {
                showError('文件太大', '图片大小不能超过 5MB');
                return;
            }

            avatarHint.textContent = '⏳ 上传中...';
            avatarHint.style.color = 'var(--accent)';
            avatarEditBtn.disabled = true;

            var token = getToken();
            if (!token) {
                showError('未登录', '请先登录');
                avatarEditBtn.disabled = false;
                avatarHint.textContent = '💡 点击 📷 更换头像';
                avatarHint.style.color = '';
                return;
            }

            var formData = new FormData();
            formData.append('avatar', file);

            try {
                var response = await fetch(API_BASE + '/api/upload-avatar', {
                    method: 'POST',
                    headers: {
                        'Authorization': 'Bearer ' + token
                    },
                    body: formData
                });

                var result = await response.json();

                if (response.ok && result.success) {
                    userAvatarEl.src = result.avatar_url + '?t=' + new Date().getTime();
                    avatarHint.textContent = '✅ 头像更新成功！';
                    avatarHint.style.color = '#4caf50';
                    showSuccess('头像更新成功');

                    if (currentUser) {
                        currentUser.avatar_url = result.avatar_url;
                        sessionStorage.setItem('user_data', JSON.stringify(currentUser));
                        CookieHelper.set('user_data', JSON.stringify(currentUser), 7);
                    }
                } else {
                    avatarHint.textContent = '❌ ' + (result.error || '上传失败');
                    avatarHint.style.color = '#dc3545';
                    showError('上传失败', result.error || '请稍后重试');
                }
            } catch (error) {
                console.error('上传错误:', error);
                avatarHint.textContent = '❌ 网络错误，请重试';
                avatarHint.style.color = '#dc3545';
                showError('网络错误', error.message || '无法连接到服务器');
            }

            avatarEditBtn.disabled = false;
            avatarInput.value = '';

            setTimeout(function() {
                if (avatarHint.textContent.includes('✅') || avatarHint.textContent.includes('❌')) {
                    avatarHint.textContent = '💡 点击 📷 更换头像';
                    avatarHint.style.color = '';
                }
            }, 4000);
        });

        // ============================================================
        // 编辑资料 - 切换
        // ============================================================
        toggleEditBtn.addEventListener('click', function() {
            isEditing = !isEditing;
            editForm.classList.toggle('show');
            this.textContent = isEditing ? '收起' : '展开';
            if (isEditing) {
                editUsername.value = currentUser?.username || '';
                editEmail.value = currentUser?.email || '';
                editPassword.value = '';
                editVerifyCode.value = '';
                verifyCodeGroup.style.display = 'none';
            }
            hideMsg();
        });

        cancelEditBtn.addEventListener('click', function() {
            isEditing = false;
            editForm.classList.remove('show');
            toggleEditBtn.textContent = '展开';
            hideMsg();
        });

        // ============================================================
        // 发送验证码（修改邮箱时）
        // ============================================================
        sendVerifyCodeBtn.addEventListener('click', async function() {
            var email = editEmail.value.trim();

            if (!email) {
                showError('邮箱为空', '请先填写新邮箱');
                return;
            }

            if (!isEmail(email)) {
                showError('邮箱格式错误', '请输入有效的邮箱地址');
                return;
            }

            if (email === currentUser?.email) {
                showError('邮箱未变更', '新邮箱与当前邮箱相同，无需验证');
                return;
            }

            this.textContent = '发送中...';
            this.disabled = true;

            try {
                var response = await fetch(API_BASE + '/api/send-verification', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: email, type: 'update' })
                });

                var data = await response.json();

                if (data.success) {
                    showSuccess('验证码已发送到 ' + email);
                    verifyCodeGroup.style.display = 'block';
                    this.textContent = '✅ 已发送';
                    setTimeout(function() {
                        sendVerifyCodeBtn.textContent = '重新发送';
                        sendVerifyCodeBtn.disabled = false;
                    }, 3000);
                } else if (response.status === 429) {
                    showError('发送太频繁', data.detail || '请稍后再试');
                    this.textContent = '重新发送';
                    this.disabled = false;
                } else {
                    showError('发送失败', data.error || '请稍后重试');
                    this.textContent = '重新发送';
                    this.disabled = false;
                }
            } catch (error) {
                showError('网络错误', '请稍后重试');
                this.textContent = '重新发送';
                this.disabled = false;
            }
        });

        editEmail.addEventListener('input', function() {
            var email = this.value.trim();
            if (email && isEmail(email) && email !== currentUser?.email) {
                verifyCodeGroup.style.display = 'block';
            } else {
                verifyCodeGroup.style.display = 'none';
            }
        });

        // ============================================================
        // 保存编辑
        // ============================================================
        saveEditBtn.addEventListener('click', async function() {
            var username = editUsername.value.trim();
            var email = editEmail.value.trim();
            var password = editPassword.value.trim();
            var code = editVerifyCode.value.trim();

            if (!username && !email && !password) {
                showError('无修改', '请至少修改一项内容');
                return;
            }

            if (username && username.length < 2) {
                showError('用户名无效', '用户名至少2个字符');
                return;
            }

            if (email && !isEmail(email)) {
                showError('邮箱格式错误', '请输入有效的邮箱地址');
                return;
            }

            if (email && email !== currentUser?.email && !isWhitelisted(email)) {
                if (!code) {
                    showError('需要验证码', '修改邮箱需要输入验证码');
                    return;
                }
                if (code.length !== 6) {
                    showError('验证码无效', '请输入6位验证码');
                    return;
                }
            }

            if (password && password.length < 6) {
                showError('密码太短', '密码至少6位');
                return;
            }

            this.disabled = true;
            this.textContent = '保存中...';

            var token = getToken();
            if (!token) {
                showError('未登录', '请重新登录');
                this.disabled = false;
                this.textContent = '💾 保存修改';
                return;
            }

            var payload = {};
            if (username) payload.username = username;
            if (email) payload.email = email;
            if (password) payload.password = password;
            if (code) payload.code = code;

            try {
                var response = await fetch(API_BASE + '/api/update-user', {
                    method: 'POST',
                    headers: {
                        'Authorization': 'Bearer ' + token,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(payload)
                });

                var data = await response.json();

                if (response.ok && data.success) {
                    showSuccess('✅ 用户信息更新成功');
                    if (data.user) {
                        currentUser = data.user;
                        sessionStorage.setItem('user_data', JSON.stringify(data.user));
                        userNameEl.textContent = data.user.username || '-';
                        userEmailEl.textContent = data.user.email || '-';
                    }
                    isEditing = false;
                    editForm.classList.remove('show');
                    toggleEditBtn.textContent = '展开';
                    verifyCodeGroup.style.display = 'none';
                    setTimeout(function() {
                        loadUserInfo();
                    }, 500);
                } else {
                    showError('更新失败', data.error || '未知错误');
                }
            } catch (error) {
                showError('网络错误', error.message || '无法连接到服务器');
            }

            this.disabled = false;
            this.textContent = '💾 保存修改';
        });

        // ============================================================
        // 页面初始化
        // ============================================================
        document.addEventListener('DOMContentLoaded', function() {
            var token = getToken();
            if (!token) {
                loadingState.style.display = 'none';
                showError('未登录', '请先登录再访问用户中心');
                setTimeout(function() {
                    window.location.href = 'login.html';
                }, 2000);
                return;
            }

            loadUserInfo();

            refreshBtn.addEventListener('click', function() {
                loadUserInfo();
            });

            logoutBtn.addEventListener('click', logout);

            backHomeBtn.addEventListener('click', function() {
                window.location.href = 'index.html';
            });
        });

        // ============================================================
        // 深色模式
        // ============================================================
        (function syncTheme() {
            var savedTheme = localStorage.getItem('theme') || 'light';
            document.documentElement.setAttribute('data-theme', savedTheme);
        })();

        console.log('🔌 API 地址:', API_BASE);
        console.log('✅ 用户中心已加载');
    </script>

</body>
</html>
