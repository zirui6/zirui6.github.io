<!DOCTYPE html>
<html lang="zh-CN" id="htmlRoot">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>用户中心 - 梓睿官网</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-body: #eef2f7;
            --bg-card: #ffffff;
            --text-primary: #0b1a2e;
            --text-secondary: #2c3e5a;
            --text-muted: #6b7f96;
            --border-color: #dce3ed;
            --shadow-lg: 0 20px 64px rgba(11, 26, 46, 0.12);
            --accent: #1a4b8c;
            --accent-light: rgba(26, 75, 140, 0.08);
            --radius-md: 14px;
            --radius-lg: 20px;
            --transition: 0.3s ease;
            --font: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
        }

        [data-theme="dark"] {
            --bg-body: #0a1628;
            --bg-card: #111d33;
            --text-primary: #e8edf4;
            --text-secondary: #a8b9d0;
            --text-muted: #6b7f96;
            --border-color: #1e3350;
            --shadow-lg: 0 20px 64px rgba(0, 0, 0, 0.5);
            --accent: #4a8fd8;
            --accent-light: rgba(74, 143, 216, 0.12);
        }

        body {
            font-family: var(--font);
            background: var(--bg-body);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
            transition: background var(--transition);
        }

        .user-container {
            background: var(--bg-card);
            border-radius: var(--radius-lg);
            padding: 44px 40px 36px;
            max-width: 500px;
            width: 100%;
            box-shadow: var(--shadow-lg);
            border: 1px solid var(--border-color);
            transition: background var(--transition), border-color var(--transition);
        }

        .user-header {
            text-align: center;
            margin-bottom: 32px;
        }

        .user-header .logo-img {
            max-width: 120px;
            height: auto;
            display: block;
            margin: 0 auto 12px;
            border-radius: 16px;
        }

        .user-header h1 {
            font-size: 22px;
            color: var(--text-primary);
        }

        .user-header p {
            color: var(--text-muted);
            font-size: 14px;
            margin-top: 4px;
        }

        /* 用户头像 */
        .avatar-section {
            text-align: center;
            margin-bottom: 28px;
        }

        .avatar-wrapper {
            position: relative;
            display: inline-block;
        }

        .avatar-wrapper img {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid var(--border-color);
            transition: border-color var(--transition);
        }

        .avatar-wrapper .avatar-edit-btn {
            position: absolute;
            bottom: 0;
            right: 0;
            background: var(--accent);
            color: #fff;
            border: none;
            border-radius: 50%;
            width: 32px;
            height: 32px;
            font-size: 14px;
            cursor: pointer;
            transition: all var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .avatar-wrapper .avatar-edit-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 2px 12px rgba(26, 75, 140, 0.3);
        }

        .avatar-wrapper .avatar-edit-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .avatar-hint {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 8px;
        }

        /* 用户信息卡片 */
        .info-card {
            background: var(--bg-body);
            border-radius: var(--radius-md);
            padding: 20px 24px;
            margin-bottom: 20px;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid var(--border-color);
        }

        .info-row:last-child {
            border-bottom: none;
        }

        .info-row .label {
            color: var(--text-muted);
            font-size: 14px;
        }

        .info-row .value {
            color: var(--text-primary);
            font-size: 14px;
            font-weight: 500;
            text-align: right;
            max-width: 60%;
            word-break: break-all;
        }

        /* 操作按钮 */
        .action-buttons {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 8px;
        }

        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: var(--radius-md);
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all var(--transition);
        }

        .btn-primary {
            background: linear-gradient(135deg, #1a4b8c, #2c6ba8);
            color: #fff;
        }

        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 20px rgba(26, 75, 140, 0.30);
        }

        .btn-danger {
            background: #dc3545;
            color: #fff;
        }

        .btn-danger:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 20px rgba(220, 53, 69, 0.30);
        }

        .btn-outline {
            background: transparent;
            color: var(--text-secondary);
            border: 2px solid var(--border-color);
        }

        .btn-outline:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none !important;
        }

        /* 消息提示 */
        .msg {
            padding: 12px 16px;
            border-radius: var(--radius-md);
            font-size: 14px;
            margin-bottom: 16px;
            display: none;
            line-height: 1.6;
        }

        .msg.error {
            display: block;
            background: #fde8e8;
            color: #c62828;
            border: 1px solid #f5c6c6;
        }

        .msg.success {
            display: block;
            background: #e8f5e9;
            color: #2e7d32;
            border: 1px solid #c8e6c9;
        }

        .msg.info {
            display: block;
            background: #e3f2fd;
            color: #0d47a1;
            border: 1px solid #bbdefb;
        }

        [data-theme="dark"] .msg.error {
            background: #2d1a1a;
            color: #ef9a9a;
            border-color: #4a2a2a;
        }

        [data-theme="dark"] .msg.success {
            background: #1a2d1a;
            color: #81c784;
            border-color: #2a4a2a;
        }

        [data-theme="dark"] .msg.info {
            background: #1a2a3d;
            color: #90caf9;
            border-color: #2a4a6a;
        }

        /* 底部链接 */
        .footer-links {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
            padding-top: 16px;
            border-top: 1px solid var(--border-color);
            font-size: 13px;
        }

        .footer-links a {
            color: var(--text-muted);
            text-decoration: none;
            transition: color var(--transition);
        }

        .footer-links a:hover {
            color: var(--accent);
        }

        /* 加载状态 */
        .loading {
            text-align: center;
            padding: 40px 0;
            color: var(--text-muted);
        }

        .loading .spinner {
            display: inline-block;
            width: 40px;
            height: 40px;
            border: 4px solid var(--border-color);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 12px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @media (max-width: 480px) {
            .user-container {
                padding: 28px 20px 24px;
            }
            .info-row {
                flex-direction: column;
                gap: 4px;
            }
            .info-row .value {
                text-align: left;
                max-width: 100%;
            }
        }
    </style>
</head>
<body>

    <div class="user-container" id="app">

        <!-- 头部 -->
        <div class="user-header">
            <img src="https://zirui6.github.io/logo1.png" alt="梓睿官网 Logo" class="logo-img" />
            <h1>👤 用户中心</h1>
            <p>欢迎回来！这里是你的个人主页</p>
        </div>

        <!-- 消息提示 -->
        <div class="msg" id="msg"></div>

        <!-- 加载状态 -->
        <div id="loadingState" class="loading">
            <div class="spinner"></div>
            <p>加载用户信息...</p>
        </div>

        <!-- 用户信息（默认隐藏） -->
        <div id="userContent" style="display:none;">

            <!-- 头像 -->
            <div class="avatar-section">
                <div class="avatar-wrapper">
                    <img id="userAvatar" src="https://zirui6.github.io/touxiang.jpg" alt="用户头像" />
                    <button class="avatar-edit-btn" id="avatarEditBtn" disabled title="暂不可修改头像（预留功能）">
                        ✏️
                    </button>
                </div>
                <div class="avatar-hint">💡 头像功能开发中，暂不可修改</div>
            </div>

            <!-- 用户信息 -->
            <div class="info-card">
                <div class="info-row">
                    <span class="label">🆔 用户ID</span>
                    <span class="value" id="userId">-</span>
                </div>
                <div class="info-row">
                    <span class="label">👤 用户名</span>
                    <span class="value" id="userName">-</span>
                </div>
                <div class="info-row">
                    <span class="label">📧 邮箱</span>
                    <span class="value" id="userEmail">-</span>
                </div>
                <div class="info-row">
                    <span class="label">📅 注册时间</span>
                    <span class="value" id="userCreatedAt">-</span>
                </div>
                <div class="info-row">
                    <span class="label">🔑 登录状态</span>
                    <span class="value" id="loginStatus" style="color: #4caf50;">✅ 已登录</span>
                </div>
            </div>

            <!-- 操作按钮 -->
            <div class="action-buttons">
                <button class="btn btn-primary" id="refreshBtn">🔄 刷新用户信息</button>
                <button class="btn btn-danger" id="logoutBtn">🚪 退出登录</button>
                <button class="btn btn-outline" id="backHomeBtn">🏠 返回首页</button>
            </div>
        </div>

        <!-- 底部链接 -->
        <div class="footer-links">
            <a href="login.html">登录页面</a>
            <a href="index.html">首页</a>
            <a href="dashboard.html">管理后台</a>
        </div>

    </div>

    <script>
        // ============================================================
        // 配置
        // ============================================================
        var API_BASE = 'https://webcloud.ziruicloud.de5.net';

        // ============================================================
        // Cookie 工具
        // ============================================================
        var CookieHelper = {
            set: function(name, value, days) {
                var expires = '';
                if (days) {
                    var date = new Date();
                    date.setTime(date.getTime() + (days * 24 * 60 * 60 * 1000));
                    expires = '; expires=' + date.toUTCString();
                }
                document.cookie = name + '=' + encodeURIComponent(value) + expires + '; path=/; SameSite=Lax';
            },
            get: function(name) {
                var nameEQ = name + '=';
                var ca = document.cookie.split(';');
                for (var i = 0; i < ca.length; i++) {
                    var c = ca[i];
                    while (c.charAt(0) === ' ') c = c.substring(1, c.length);
                    if (c.indexOf(nameEQ) === 0) {
                        return decodeURIComponent(c.substring(nameEQ.length, c.length));
                    }
                }
                return null;
            },
            delete: function(name) {
                document.cookie = name + '=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;';
            }
        };

        // ============================================================
        // DOM 引用
        // ============================================================
        var msgEl = document.getElementById('msg');
        var loadingState = document.getElementById('loadingState');
        var userContent = document.getElementById('userContent');

        var userIdEl = document.getElementById('userId');
        var userNameEl = document.getElementById('userName');
        var userEmailEl = document.getElementById('userEmail');
        var userCreatedAtEl = document.getElementById('userCreatedAt');
        var userAvatarEl = document.getElementById('userAvatar');

        var refreshBtn = document.getElementById('refreshBtn');
        var logoutBtn = document.getElementById('logoutBtn');
        var backHomeBtn = document.getElementById('backHomeBtn');
        var avatarEditBtn = document.getElementById('avatarEditBtn');

        // ============================================================
        // 消息系统
        // ============================================================
        function showError(title, detail) {
            msgEl.innerHTML = '<strong>❌ ' + title + '</strong><br>' + detail;
            msgEl.className = 'msg error';
        }

        function showSuccess(text) {
            msgEl.textContent = '✅ ' + text;
            msgEl.className = 'msg success';
        }

        function showInfo(text) {
            msgEl.textContent = 'ℹ️ ' + text;
            msgEl.className = 'msg info';
        }

        function hideMsg() {
            msgEl.className = 'msg';
            msgEl.textContent = '';
        }

        // ============================================================
        // 工具函数
        // ============================================================
        function getToken() {
            return sessionStorage.getItem('auth_token') || CookieHelper.get('auth_token');
        }

        function formatDate(dateStr) {
            if (!dateStr) return '-';
            var d = new Date(dateStr);
            return d.toLocaleString('zh-CN', {
                year: 'numeric',
                month: '2-digit',
                day: '2-digit',
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        // ============================================================
        // 加载用户信息
        // ============================================================
        async function loadUserInfo() {
            hideMsg();
            loadingState.style.display = 'block';
            userContent.style.display = 'none';

            var token = getToken();

            if (!token) {
                loadingState.style.display = 'none';
                showError('未登录', '请先登录再访问用户中心');
                setTimeout(function() {
                    window.location.href = 'login.html';
                }, 2000);
                return;
            }

            try {
                var response = await fetch(API_BASE + '/api/verify', {
                    headers: {
                        'Authorization': 'Bearer ' + token
                    }
                });

                var data = await response.json();

                if (data.valid && data.user) {
                    // 显示用户信息
                    userIdEl.textContent = data.user.id || '-';
                    userNameEl.textContent = data.user.username || '-';
                    userEmailEl.textContent = data.user.email || '-';
                    userCreatedAtEl.textContent = formatDate(data.user.created_at) || '-';

                    // 保存到 sessionStorage
                    sessionStorage.setItem('user_data', JSON.stringify(data.user));

                    // 显示内容
                    loadingState.style.display = 'none';
                    userContent.style.display = 'block';
                    showSuccess('用户信息加载成功');
                } else {
                    loadingState.style.display = 'none';
                    showError('会话过期', '请重新登录');
                    clearUserSession();
                    setTimeout(function() {
                        window.location.href = 'login.html';
                    }, 2000);
                }
            } catch (error) {
                console.error('加载用户信息失败:', error);
                loadingState.style.display = 'none';
                showError('网络错误', error.message || '无法加载用户信息');

                // 尝试从本地缓存恢复
                var cachedUser = sessionStorage.getItem('user_data');
                if (cachedUser) {
                    try {
                        var user = JSON.parse(cachedUser);
                        userIdEl.textContent = user.id || '-';
                        userNameEl.textContent = user.username || '-';
                        userEmailEl.textContent = user.email || '-';
                        userCreatedAtEl.textContent = formatDate(user.created_at) || '-';
                        userContent.style.display = 'block';
                        showInfo('显示缓存数据（网络异常）');
                    } catch (e) {
                        // 缓存无效
                    }
                }
            }
        }

        // ============================================================
        // 退出登录
        // ============================================================
        function clearUserSession() {
            sessionStorage.clear();
            CookieHelper.delete('auth_token');
            CookieHelper.delete('user_data');
            CookieHelper.delete('isLoggedIn');
            CookieHelper.delete('userId');
            CookieHelper.delete('userEmail');
            CookieHelper.delete('displayName');
            CookieHelper.delete('role');
        }

        function logout() {
            if (confirm('确定要退出登录吗？')) {
                clearUserSession();
                showSuccess('已退出登录，正在跳转...');
                setTimeout(function() {
                    window.location.href = 'login.html';
                }, 1500);
            }
        }

        // ============================================================
        // 页面初始化
        // ============================================================
        document.addEventListener('DOMContentLoaded', function() {
            // 检查是否已登录
            var token = getToken();
            if (!token) {
                loadingState.style.display = 'none';
                showError('未登录', '请先登录再访问用户中心');
                setTimeout(function() {
                    window.location.href = 'login.html';
                }, 2000);
                return;
            }

            // 加载用户信息
            loadUserInfo();

            // 事件绑定
            refreshBtn.addEventListener('click', function() {
                loadUserInfo();
            });

            logoutBtn.addEventListener('click', logout);

            backHomeBtn.addEventListener('click', function() {
                window.location.href = 'index.html';
            });

            // 头像编辑按钮提示
            avatarEditBtn.addEventListener('click', function() {
                showInfo('头像功能开发中，敬请期待！');
            });
        });

        // ============================================================
        // 深色模式
        // ============================================================
        (function syncTheme() {
            var savedTheme = localStorage.getItem('theme') || 'light';
            document.documentElement.setAttribute('data-theme', savedTheme);
        })();

        console.log('🔌 API 地址:', API_BASE);
        console.log('✅ 用户中心已加载');
    </script>

</body>
</html>
