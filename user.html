        <!-- ===== 新增：返回按钮 ===== -->
        <div style="margin-bottom:16px;">
            <a href="#" id="backLink" style="
                color: var(--text-muted);
                text-decoration: none;
                font-size: 14px;
                display: inline-flex;
                align-items: center;
                gap: 6px;
                transition: color var(--transition);
            " onclick="goBack()">← 返回</a>
        </div>

        <!-- ... 选项卡、表单等保持不变 ... -->

    <script>
        // ============================================================
        // 在原有脚本顶部添加
        // ============================================================

        // ============================================================
        // 0. 登录来源追踪
        // ============================================================

        // 获取来源页面
        function getSource() {
            // 1. 从 URL 参数获取
            var urlParams = new URLSearchParams(window.location.search);
            var source = urlParams.get('source');
            if (source) return source;

            // 2. 从 sessionStorage 获取
            source = sessionStorage.getItem('login_source');
            if (source) return source;

            // 3. 从 document.referrer 获取（从其他页面跳转过来）
            var referrer = document.referrer;
            if (referrer) {
                if (referrer.includes('chat.ziruicloud.de5.net') || referrer.includes('chat.html')) {
                    return 'chat';
                }
                if (referrer.includes('cloud.html')) {
                    return 'cloud';
                }
                if (referrer.includes('user.html')) {
                    return 'user';
                }
                if (referrer.includes('index.html') || referrer.includes('zirui6.github.io/')) {
                    return 'home';
                }
                if (referrer.includes('4275.com')) {
                    return '4275';
                }
            }

            // 4. 默认返回首页
            return 'home';
        }

        // 获取返回地址
        function getReturnUrl(source) {
            var base = 'https://zirui6.github.io';
            var map = {
                'chat': base + '/chat.html',
                'cloud': base + '/cloud.html',
                'user': base + '/user.html',
                'home': base + '/index.html',
                '4275': 'https://4275.com',
                'login': base + '/login.html',
                'dashboard': base + '/dashboard.html'
            };
            return map[source] || base + '/index.html';
        }

        // 显示返回链接
        function showBackLink() {
            var source = getSource();
            var backLink = document.getElementById('backLink');
            if (!backLink) return;

            var labels = {
                'chat': '← 返回聊天',
                'cloud': '← 返回云盘',
                'user': '← 返回用户中心',
                'home': '← 返回首页',
                '4275': '← 返回 4275',
                'dashboard': '← 返回仪表盘'
            };

            backLink.textContent = labels[source] || '← 返回';
            backLink.href = getReturnUrl(source);

            // 保存来源到 sessionStorage，登录成功后使用
            sessionStorage.setItem('login_source', source);
        }

        // 返回上一页
        function goBack() {
            var source = getSource();
            var url = getReturnUrl(source);
            window.location.href = url;
        }

        // ============================================================
