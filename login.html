<!DOCTYPE html>
<html lang="zh-CN" id="htmlRoot">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>登录</title>
    <style>
        /* ============================================================
           全局样式
           ============================================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-body: #eef2f7;
            --bg-card: #ffffff;
            --text-primary: #0b1a2e;
            --text-secondary: #2c3e5a;
            --text-muted: #6b7f96;
            --border-color: #dce3ed;
            --shadow-lg: 0 20px 64px rgba(11, 26, 46, 0.12);
            --accent: #1a4b8c;
            --accent-light: rgba(26, 75, 140, 0.08);
            --radius-md: 14px;
            --radius-lg: 20px;
            --transition: 0.3s ease;
            --font: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
        }

        [data-theme="dark"] {
            --bg-body: #0a1628;
            --bg-card: #111d33;
            --text-primary: #e8edf4;
            --text-secondary: #a8b9d0;
            --text-muted: #6b7f96;
            --border-color: #1e3350;
            --shadow-lg: 0 20px 64px rgba(0, 0, 0, 0.5);
            --accent: #4a8fd8;
            --accent-light: rgba(74, 143, 216, 0.12);
        }

        body {
            font-family: var(--font);
            background: var(--bg-body);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
            transition: background var(--transition);
        }

        .login-container {
            background: var(--bg-card);
            border-radius: var(--radius-lg);
            padding: 44px 40px 36px;
            max-width: 440px;
            width: 100%;
            box-shadow: var(--shadow-lg);
            border: 1px solid var(--border-color);
            transition: background var(--transition), border-color var(--transition);
        }

        .login-header {
            text-align: center;
            margin-bottom: 32px;
        }

        .login-header .logo-img {
            max-width: 180px;
            height: auto;
            display: block;
            margin: 0 auto 12px;
            border-radius: 16px;
        }

        .login-header p {
            color: var(--text-muted);
            font-size: 15px;
            margin-top: 6px;
        }

        .tabs {
            display: flex;
            gap: 4px;
            background: var(--bg-body);
            border-radius: var(--radius-md);
            padding: 4px;
            margin-bottom: 28px;
        }

        .tabs .tab {
            flex: 1;
            padding: 10px 0;
            border: none;
            background: transparent;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all var(--transition);
        }

        .tabs .tab.active {
            background: var(--bg-card);
            color: var(--text-primary);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
        }

        .tabs .tab:hover:not(.active) {
            color: var(--text-primary);
        }

        .form-panel {
            display: none;
        }

        .form-panel.active {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 5px;
        }

        /* 统一输入框样式 - 所有输入框一致 */
        .form-group input[type="text"],
        .form-group input[type="email"],
        .form-group input[type="password"] {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid var(--border-color);
            border-radius: var(--radius-md);
            font-size: 15px;
            background: var(--bg-body);
            color: var(--text-primary);
            transition: all var(--transition);
            outline: none;
        }

        .form-group input[type="text"]:focus,
        .form-group input[type="email"]:focus,
        .form-group input[type="password"]:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 4px var(--accent-light);
            background: var(--bg-card);
        }

        .form-group input[type="text"]::placeholder,
        .form-group input[type="email"]::placeholder,
        .form-group input[type="password"]::placeholder {
            color: var(--text-muted);
        }

        /* 密码输入框容器 */
        .password-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .password-wrapper input {
            width: 100%;
            padding: 12px 48px 12px 16px !important;
        }

        .toggle-password {
            position: absolute;
            right: 14px;
            background: none;
            border: none;
            cursor: pointer;
            font-size: 18px;
            padding: 4px;
            color: var(--text-muted);
            transition: color var(--transition);
            line-height: 1;
        }

        .toggle-password:hover {
            color: var(--text-primary);
        }

        .form-group .hint {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 4px;
        }

        .form-group .checkbox-group {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 4px;
        }

        .form-group .checkbox-group input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: var(--accent);
        }

        .form-group .checkbox-group label {
            margin-bottom: 0;
            font-weight: 400;
            cursor: pointer;
            font-size: 14px;
        }

        .btn-primary {
            width: 100%;
            padding: 13px;
            background: linear-gradient(135deg, #1a4b8c, #2c6ba8);
            color: #fff;
            border: none;
            border-radius: var(--radius-md);
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all var(--transition);
        }

        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 20px rgba(26, 75, 140, 0.30);
        }

        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .msg {
            padding: 12px 16px;
            border-radius: var(--radius-md);
            font-size: 14px;
            margin-bottom: 16px;
            display: none;
            line-height: 1.6;
            word-break: break-all;
        }

        .msg .error-code {
            display: block;
            font-weight: 700;
            font-size: 13px;
            margin-bottom: 2px;
        }

        .msg .error-detail {
            display: block;
            font-size: 13px;
            opacity: 0.85;
        }

        .msg .error-suggestion {
            display: block;
            font-size: 12px;
            margin-top: 6px;
            opacity: 0.75;
            border-top: 1px solid rgba(0,0,0,0.08);
            padding-top: 6px;
        }

        .msg.error {
            display: block;
            background: #fde8e8;
            color: #c62828;
            border: 1px solid #f5c6c6;
        }

        .msg.success {
            display: block;
            background: #e8f5e9;
            color: #2e7d32;
            border: 1px solid #c8e6c9;
        }

        .msg.info {
            display: block;
            background: #e3f2fd;
            color: #0d47a1;
            border: 1px solid #bbdefb;
        }

        [data-theme="dark"] .msg.error {
            background: #2d1a1a;
            color: #ef9a9a;
            border-color: #4a2a2a;
        }

        [data-theme="dark"] .msg.success {
            background: #1a2d1a;
            color: #81c784;
            border-color: #2a4a2a;
        }

        [data-theme="dark"] .msg.info {
            background: #1a2a3d;
            color: #90caf9;
            border-color: #2a4a6a;
        }

        [data-theme="dark"] .msg .error-suggestion {
            border-top-color: rgba(255,255,255,0.08);
        }

        .footer-links {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
            padding-top: 16px;
            border-top: 1px solid var(--border-color);
            font-size: 13px;
        }

        .footer-links a {
            color: var(--text-muted);
            text-decoration: none;
            transition: color var(--transition);
        }

        .footer-links a:hover {
            color: var(--accent);
        }

        /* 连接状态指示器 */
        .connection-status {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 16px;
            padding: 8px 12px;
            background: var(--bg-body);
            border-radius: var(--radius-md);
        }

        .connection-status .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .connection-status .dot.checking {
            background: #ffa726;
            animation: pulse 1s infinite;
        }

        .connection-status .dot.online {
            background: #4caf50;
        }

        .connection-status .dot.offline {
            background: #f44336;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        @media (max-width: 480px) {
            .login-container {
                padding: 28px 20px 24px;
            }
            .login-header .logo-img {
                max-width: 140px;
                border-radius: 12px;
            }
            .footer-links {
                flex-wrap: wrap;
                gap: 8px;
                justify-content: center;
            }
        }
    </style>
</head>
<body>

    <div class="login-container">

        <!-- 头部 -->
        <div class="login-header">
            <img src="https://zirui6.github.io/logo1.png" alt="梓睿官网 Logo" class="logo-img" />
            <p>登录以继续访问</p>
        </div>

        <!-- 连接状态 -->
        <div class="connection-status" id="connectionStatus">
            <span class="dot checking" id="statusDot"></span>
            <span id="statusText">正在检测服务器连接...</span>
        </div>

        <!-- 消息提示 -->
        <div class="msg" id="msg"></div>

        <!-- 选项卡 -->
        <div class="tabs">
            <button class="tab active" data-tab="login">登录</button>
            <button class="tab" data-tab="register">注册</button>
        </div>

        <!-- 登录面板 -->
        <div class="form-panel active" id="panelLogin">
            <form id="loginForm">
                <div class="form-group">
                    <label for="loginAccount">用户名 / 邮箱</label>
                    <input type="text" id="loginAccount" placeholder="请输入用户名或邮箱" required autofocus />
                </div>
                <div class="form-group">
                    <label for="loginPassword">密码</label>
                    <div class="password-wrapper">
                        <input type="password" id="loginPassword" placeholder="请输入密码" required minlength="6" />
                        <button type="button" class="toggle-password" id="toggleLoginPassword" aria-label="显示/隐藏密码">👁️</button>
                    </div>
                    <div class="hint">密码长度不少于6位</div>
                </div>
                <div class="form-group">
                    <div class="checkbox-group">
                        <input type="checkbox" id="rememberMe" checked />
                        <label for="rememberMe">记住我（7天）</label>
                    </div>
                </div>
                <button type="submit" class="btn-primary" id="loginBtn">登 录</button>
            </form>
        </div>

        <!-- 注册面板 -->
        <div class="form-panel" id="panelRegister">
            <form id="registerForm">
                <div class="form-group">
                    <label for="regAccount">用户名</label>
                    <input type="text" id="regAccount" placeholder="请设置用户名（字母或数字）" required />
                    <div class="hint">建议使用字母和数字组合</div>
                </div>
                <div class="form-group">
                    <label for="regEmail">邮箱</label>
                    <input type="email" id="regEmail" placeholder="请输入邮箱" required />
                </div>
                <div class="form-group">
                    <label for="regPassword">密码</label>
                    <div class="password-wrapper">
                        <input type="password" id="regPassword" placeholder="请设置密码（至少6位）" required minlength="6" />
                        <button type="button" class="toggle-password" id="toggleRegPassword" aria-label="显示/隐藏密码">👁️</button>
                    </div>
                    <div class="hint">密码长度不少于6位</div>
                </div>
                <div class="form-group">
                    <label for="regConfirm">确认密码</label>
                    <div class="password-wrapper">
                        <input type="password" id="regConfirm" placeholder="请再次输入密码" required minlength="6" />
                        <button type="button" class="toggle-password" id="toggleRegConfirm" aria-label="显示/隐藏密码">👁️</button>
                    </div>
                </div>
                <button type="submit" class="btn-primary" id="regBtn">注 册</button>
            </form>
        </div>

        <!-- 底部链接 -->
        <div class="footer-links">
            <a href="https://www.jotform.com/form/262001826516046" target="_blank">申诉</a>
            <a href="dashboard.html">管理员入口</a>
            <a href="index.html">返回首页</a>
        </div>

    </div>

    <script>
        // ============================================================
        // 1. 配置 - Cloudflare Worker API
        // ============================================================
        var API_BASE = 'https://webcloud.ziruicloud.de5.net';

        // ============================================================
        // 2. Cookie 工具函数
        // ============================================================
        var CookieHelper = {
            set: function(name, value, days) {
                var expires = '';
                if (days) {
                    var date = new Date();
                    date.setTime(date.getTime() + (days * 24 * 60 * 60 * 1000));
                    expires = '; expires=' + date.toUTCString();
                }
                document.cookie = name + '=' + encodeURIComponent(value) + expires + '; path=/; SameSite=Lax';
            },
            get: function(name) {
                var nameEQ = name + '=';
                var ca = document.cookie.split(';');
                for (var i = 0; i < ca.length; i++) {
                    var c = ca[i];
                    while (c.charAt(0) === ' ') c = c.substring(1, c.length);
                    if (c.indexOf(nameEQ) === 0) {
                        return decodeURIComponent(c.substring(nameEQ.length, c.length));
                    }
                }
                return null;
            },
            delete: function(name) {
                document.cookie = name + '=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;';
            },
            getAll: function() {
                var cookies = {};
                var ca = document.cookie.split(';');
                for (var i = 0; i < ca.length; i++) {
                    var c = ca[i];
                    while (c.charAt(0) === ' ') c = c.substring(1, c.length);
                    var eqPos = c.indexOf('=');
                    if (eqPos > 0) {
                        var name = c.substring(0, eqPos);
                        var value = decodeURIComponent(c.substring(eqPos + 1));
                        cookies[name] = value;
                    }
                }
                return cookies;
            }
        };

        // ============================================================
        // 3. DOM 引用
        // ============================================================
        var msgEl = document.getElementById('msg');
        var loginForm = document.getElementById('loginForm');
        var registerForm = document.getElementById('registerForm');
        var loginBtn = document.getElementById('loginBtn');
        var regBtn = document.getElementById('regBtn');
        var rememberMe = document.getElementById('rememberMe');
        var statusDot = document.getElementById('statusDot');
        var statusText = document.getElementById('statusText');

        // 密码切换按钮
        var toggleLoginPassword = document.getElementById('toggleLoginPassword');
        var toggleRegPassword = document.getElementById('toggleRegPassword');
        var toggleRegConfirm = document.getElementById('toggleRegConfirm');

        var loginPassword = document.getElementById('loginPassword');
        var regPassword = document.getElementById('regPassword');
        var regConfirm = document.getElementById('regConfirm');

        // ============================================================
        // 4. 密码显示/隐藏切换
        // ============================================================
        function togglePasswordVisibility(input, button) {
            if (!input || !button) return;

            button.addEventListener('click', function() {
                var isPassword = input.getAttribute('type') === 'password';
                input.setAttribute('type', isPassword ? 'text' : 'password');
                button.textContent = isPassword ? '🙈' : '👁️';
                button.setAttribute('aria-label', isPassword ? '隐藏密码' : '显示密码');
            });
        }

        // 初始化密码切换
        togglePasswordVisibility(loginPassword, toggleLoginPassword);
        togglePasswordVisibility(regPassword, toggleRegPassword);
        togglePasswordVisibility(regConfirm, toggleRegConfirm);

        // ============================================================
        // 5. 消息系统
        // ============================================================
        function showError(title, detail, suggestion) {
            msgEl.innerHTML =
                '<span class="error-code">❌ ' + title + '</span>' +
                '<span class="error-detail">' + detail + '</span>' +
                (suggestion ? '<span class="error-suggestion">💡 ' + suggestion + '</span>' : '');
            msgEl.className = 'msg error';
        }

        function showSuccess(text) {
            msgEl.textContent = text;
            msgEl.className = 'msg success';
        }

        function showInfo(text) {
            msgEl.textContent = text;
            msgEl.className = 'msg info';
        }

        function hideMsg() {
            msgEl.className = 'msg';
            msgEl.innerHTML = '';
        }

        // ============================================================
        // 6. 连接状态检测
        // ============================================================
        async function checkConnection() {
            statusDot.className = 'dot checking';
            statusText.textContent = '正在检测服务器连接...';

            try {
                var response = await fetch(API_BASE + '/health', {
                    method: 'GET',
                    headers: { 'Content-Type': 'application/json' },
                    signal: AbortSignal.timeout(5000)
                });

                if (response.ok) {
                    var data = await response.json();
                    statusDot.className = 'dot online';
                    statusText.textContent = '✅ 服务器连接正常 (Cloudflare Workers)';
                    console.log('✅ 健康检查通过:', data);
                    return true;
                } else {
                    statusDot.className = 'dot offline';
                    statusText.textContent = '⚠️ 服务器响应异常 (HTTP ' + response.status + ')';
                    return false;
                }
            } catch (error) {
                statusDot.className = 'dot offline';

                if (error.name === 'TimeoutError' || error.name === 'AbortError') {
                    statusText.textContent = '⏱️ 连接超时 - 服务器无响应';
                } else if (error.message.includes('Failed to fetch') || error.message.includes('NetworkError')) {
                    statusText.textContent = '🌐 网络错误 - 无法连接到服务器';
                } else {
                    statusText.textContent = '❌ 连接失败: ' + error.message;
                }

                console.error('❌ 连接检测失败:', error);
                return false;
            }
        }

        // ============================================================
        // 7. 选项卡切换
        // ============================================================
        document.querySelectorAll('.tab').forEach(function(tab) {
            tab.addEventListener('click', function() {
                document.querySelectorAll('.tab').forEach(function(t) { t.classList.remove('active'); });
                this.classList.add('active');
                var target = this.dataset.tab;
                document.querySelectorAll('.form-panel').forEach(function(p) { p.classList.remove('active'); });
                document.getElementById('panel' + target.charAt(0).toUpperCase() + target.slice(1)).classList.add('active');
                hideMsg();
            });
        });

        // ============================================================
        // 8. 工具函数
        // ============================================================
        function isEmail(value) {
            return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value);
        }

        function saveUserSession(token, user, remember) {
            var sessionData = {
                isLoggedIn: 'true',
                userId: user.id || '',
                username: user.username || '',
                email: user.email || '',
                displayName: user.username || (user.email ? user.email.split('@')[0] : ''),
                role: 'user',
                loginTime: new Date().toISOString()
            };

            sessionStorage.setItem('isLoggedIn', 'true');
            sessionStorage.setItem('auth_token', token);
            sessionStorage.setItem('user_data', JSON.stringify(user));
            sessionStorage.setItem('userId', sessionData.userId);
            sessionStorage.setItem('userEmail', sessionData.email);
            sessionStorage.setItem('displayName', sessionData.displayName);
            sessionStorage.setItem('role', sessionData.role);

            if (remember) {
                CookieHelper.set('auth_token', token, 7);
                CookieHelper.set('user_data', JSON.stringify(user), 7);
                CookieHelper.set('isLoggedIn', 'true', 7);
                CookieHelper.set('userId', sessionData.userId, 7);
                CookieHelper.set('userEmail', sessionData.email, 7);
                CookieHelper.set('displayName', sessionData.displayName, 7);
                CookieHelper.set('role', sessionData.role, 7);
            } else {
                CookieHelper.set('auth_token', token, null);
                CookieHelper.set('user_data', JSON.stringify(user), null);
                CookieHelper.set('isLoggedIn', 'true', null);
                CookieHelper.set('userId', sessionData.userId, null);
                CookieHelper.set('userEmail', sessionData.email, null);
                CookieHelper.set('displayName', sessionData.displayName, null);
                CookieHelper.set('role', sessionData.role, null);
            }
        }

        function clearUserSession() {
            sessionStorage.clear();
            CookieHelper.delete('auth_token');
            CookieHelper.delete('user_data');
            CookieHelper.delete('isLoggedIn');
            CookieHelper.delete('userId');
            CookieHelper.delete('userEmail');
            CookieHelper.delete('displayName');
            CookieHelper.delete('role');
        }

        function getToken() {
            return sessionStorage.getItem('auth_token') || CookieHelper.get('auth_token');
        }

        // ============================================================
        // 9. API 调用函数
        // ============================================================
        async function apiCall(endpoint, data) {
            var response = await fetch(API_BASE + endpoint, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(data)
            });

            var result = await response.json();
            return { status: response.status, data: result };
        }

        // ============================================================
        // 10. 登录处理 - 跳转到用户中心
        // ============================================================
        loginForm.addEventListener('submit', async function(event) {
            event.preventDefault();
            hideMsg();

            var account = document.getElementById('loginAccount').value.trim();
            var password = document.getElementById('loginPassword').value.trim();
            var remember = rememberMe.checked;

            if (!account || !password) {
                showError('信息不完整', '请填写用户名/邮箱和密码');
                return;
            }

            loginBtn.disabled = true;
            loginBtn.textContent = '登录中...';

            try {
                console.log('🔑 尝试登录，账号:', account);

                var result = await apiCall('/api/login', {
                    account: account,
                    password: password
                });

                if (result.status === 200 && result.data.success) {
                    // 保存会话
                    saveUserSession(result.data.token, result.data.user, remember);

                    showSuccess('✅ 登录成功！正在跳转到用户中心...');

                    setTimeout(function() {
                        window.location.href = 'user.html';
                    }, 1200);
                } else {
                    showError('登录失败', result.data.error || '用户名或密码错误');
                }
            } catch (error) {
                console.error('登录错误:', error);
                showError('网络错误', error.message || '无法连接到服务器');
            }

            loginBtn.disabled = false;
            loginBtn.textContent = '登录';
        });

        // ============================================================
        // 11. 注册处理
        // ============================================================
        registerForm.addEventListener('submit', async function(event) {
            event.preventDefault();
            hideMsg();

            var username = document.getElementById('regAccount').value.trim();
            var email = document.getElementById('regEmail').value.trim();
            var password = document.getElementById('regPassword').value.trim();
            var confirm = document.getElementById('regConfirm').value.trim();

            if (!username || !email || !password || !confirm) {
                showError('信息不完整', '请填写所有字段');
                return;
            }

            if (username.length < 2) {
                showError('用户名无效', '用户名至少需要2个字符');
                return;
            }

            if (!isEmail(email)) {
                showError('邮箱格式错误', '请输入有效的邮箱地址');
                return;
            }

            if (password.length < 6) {
                showError('密码太短', '密码长度不能少于6位');
                return;
            }

            if (password !== confirm) {
                showError('密码不匹配', '两次输入的密码不一致');
                return;
            }

            regBtn.disabled = true;
            regBtn.textContent = '注册中...';

            try {
                console.log('📝 注册新用户:', email);

                var result = await apiCall('/api/register', {
                    username: username,
                    email: email,
                    password: password
                });

                if (result.status === 201 && result.data.success) {
                    // 自动登录
                    saveUserSession(result.data.token, result.data.user, true);

                    showSuccess('✅ 注册成功！正在跳转到用户中心...');

                    setTimeout(function() {
                        window.location.href = 'user.html';
                    }, 1500);
                } else {
                    showError('注册失败', result.data.error || '未知错误');
                }
            } catch (error) {
                console.error('注册错误:', error);
                showError('网络错误', error.message || '无法连接到服务器');
            }

            regBtn.disabled = false;
            regBtn.textContent = '注册';
        });

        // ============================================================
        // 12. 检查已登录会话
        // ============================================================
        (function checkSession() {
            var token = getToken();

            if (token) {
                // 验证令牌是否有效
                fetch(API_BASE + '/api/verify', {
                    headers: {
                        'Authorization': 'Bearer ' + token
                    }
                })
                .then(function(res) { return res.json(); })
                .then(function(data) {
                    if (data.valid) {
                        // 恢复用户数据
                        var userData = CookieHelper.get('user_data') || sessionStorage.getItem('user_data');
                        if (userData) {
                            try {
                                var user = JSON.parse(userData);
                                sessionStorage.setItem('isLoggedIn', 'true');
                                sessionStorage.setItem('userId', user.id || '');
                                sessionStorage.setItem('userEmail', user.email || '');
                                sessionStorage.setItem('displayName', user.username || user.email.split('@')[0] || '');
                                sessionStorage.setItem('role', 'user');
                            } catch (e) {
                                console.warn('恢复用户数据失败:', e);
                            }
                        }
                        window.location.href = 'user.html';
                    } else {
                        clearUserSession();
                    }
                })
                .catch(function() {
                    clearUserSession();
                });
            }

            // 检查 URL 中是否有认证参数（OAuth 回调兼容）
            if (window.location.hash && window.location.hash.includes('access_token')) {
                console.log('检测到 OAuth 回调，但当前使用 Cloudflare Workers 认证');
            }
        })();

        // ============================================================
        // 13. 深色模式
        // ============================================================
        (function syncTheme() {
            var savedTheme = localStorage.getItem('theme') || 'light';
            document.documentElement.setAttribute('data-theme', savedTheme);
        })();

        // ============================================================
        // 14. 页面加载完成后检测连接
        // ============================================================
        document.addEventListener('DOMContentLoaded', function() {
            setTimeout(checkConnection, 500);
        });

        console.log('🔌 API 地址:', API_BASE);
        console.log('✅ 登录页面已加载 (Cloudflare Workers + D1)');
    </script>

</body>
</html>
