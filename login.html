<html lang="zh-CN" id="htmlRoot">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>登录</title>
    <style>
        /* ============================================================
           全局样式
           ============================================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-body: #eef2f7;
            --bg-card: #ffffff;
            --text-primary: #0b1a2e;
            --text-secondary: #2c3e5a;
            --text-muted: #6b7f96;
            --border-color: #dce3ed;
            --shadow-lg: 0 20px 64px rgba(11, 26, 46, 0.12);
            --accent: #1a4b8c;
            --accent-light: rgba(26, 75, 140, 0.08);
            --radius-md: 14px;
            --radius-lg: 20px;
            --transition: 0.3s ease;
            --font: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
        }

        [data-theme="dark"] {
            --bg-body: #0a1628;
            --bg-card: #111d33;
            --text-primary: #e8edf4;
            --text-secondary: #a8b9d0;
            --text-muted: #6b7f96;
            --border-color: #1e3350;
            --shadow-lg: 0 20px 64px rgba(0, 0, 0, 0.5);
            --accent: #4a8fd8;
            --accent-light: rgba(74, 143, 216, 0.12);
        }

        body {
            font-family: var(--font);
            background: var(--bg-body);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
            transition: background var(--transition);
        }

        .login-container {
            background: var(--bg-card);
            border-radius: var(--radius-lg);
            padding: 44px 40px 36px;
            max-width: 440px;
            width: 100%;
            box-shadow: var(--shadow-lg);
            border: 1px solid var(--border-color);
            transition: background var(--transition), border-color var(--transition);
        }

        .login-header {
            text-align: center;
            margin-bottom: 32px;
        }

        .login-header .logo-img {
            max-width: 180px;
            height: auto;
            display: block;
            margin: 0 auto 12px;
            border-radius: 16px;
        }

        .login-header p {
            color: var(--text-muted);
            font-size: 15px;
            margin-top: 6px;
        }

        .tabs {
            display: flex;
            gap: 4px;
            background: var(--bg-body);
            border-radius: var(--radius-md);
            padding: 4px;
            margin-bottom: 28px;
        }

        .tabs .tab {
            flex: 1;
            padding: 10px 0;
            border: none;
            background: transparent;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all var(--transition);
        }

        .tabs .tab.active {
            background: var(--bg-card);
            color: var(--text-primary);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
        }

        .tabs .tab:hover:not(.active) {
            color: var(--text-primary);
        }

        .form-panel {
            display: none;
        }

        .form-panel.active {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 5px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid var(--border-color);
            border-radius: var(--radius-md);
            font-size: 15px;
            background: var(--bg-body);
            color: var(--text-primary);
            transition: all var(--transition);
            outline: none;
        }

        .form-group input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 4px var(--accent-light);
            background: var(--bg-card);
        }

        .form-group input::placeholder {
            color: var(--text-muted);
        }

        .form-group .hint {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 4px;
        }

        .form-group .checkbox-group {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 4px;
        }

        .form-group .checkbox-group input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: var(--accent);
        }

        .form-group .checkbox-group label {
            margin-bottom: 0;
            font-weight: 400;
            cursor: pointer;
            font-size: 14px;
        }

        .btn-primary {
            width: 100%;
            padding: 13px;
            background: linear-gradient(135deg, #1a4b8c, #2c6ba8);
            color: #fff;
            border: none;
            border-radius: var(--radius-md);
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all var(--transition);
        }

        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 20px rgba(26, 75, 140, 0.30);
        }

        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .msg {
            padding: 12px 16px;
            border-radius: var(--radius-md);
            font-size: 14px;
            margin-bottom: 16px;
            display: none;
            line-height: 1.6;
            word-break: break-all;
        }

        .msg .error-code {
            display: block;
            font-weight: 700;
            font-size: 13px;
            margin-bottom: 2px;
        }

        .msg .error-detail {
            display: block;
            font-size: 13px;
            opacity: 0.85;
        }

        .msg .error-suggestion {
            display: block;
            font-size: 12px;
            margin-top: 6px;
            opacity: 0.75;
            border-top: 1px solid rgba(0,0,0,0.08);
            padding-top: 6px;
        }

        .msg.error {
            display: block;
            background: #fde8e8;
            color: #c62828;
            border: 1px solid #f5c6c6;
        }

        .msg.success {
            display: block;
            background: #e8f5e9;
            color: #2e7d32;
            border: 1px solid #c8e6c9;
        }

        .msg.info {
            display: block;
            background: #e3f2fd;
            color: #0d47a1;
            border: 1px solid #bbdefb;
        }

        [data-theme="dark"] .msg.error {
            background: #2d1a1a;
            color: #ef9a9a;
            border-color: #4a2a2a;
        }

        [data-theme="dark"] .msg.success {
            background: #1a2d1a;
            color: #81c784;
            border-color: #2a4a2a;
        }

        [data-theme="dark"] .msg.info {
            background: #1a2a3d;
            color: #90caf9;
            border-color: #2a4a6a;
        }

        [data-theme="dark"] .msg .error-suggestion {
            border-top-color: rgba(255,255,255,0.08);
        }

        .footer-links {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
            padding-top: 16px;
            border-top: 1px solid var(--border-color);
            font-size: 13px;
        }

        .footer-links a {
            color: var(--text-muted);
            text-decoration: none;
            transition: color var(--transition);
        }

        .footer-links a:hover {
            color: var(--accent);
        }

        /* 连接状态指示器 */
        .connection-status {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 16px;
            padding: 8px 12px;
            background: var(--bg-body);
            border-radius: var(--radius-md);
        }

        .connection-status .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .connection-status .dot.checking {
            background: #ffa726;
            animation: pulse 1s infinite;
        }

        .connection-status .dot.online {
            background: #4caf50;
        }

        .connection-status .dot.offline {
            background: #f44336;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        @media (max-width: 480px) {
            .login-container {
                padding: 28px 20px 24px;
            }
            .login-header .logo-img {
                max-width: 140px;
                border-radius: 12px;
            }
            .footer-links {
                flex-wrap: wrap;
                gap: 8px;
                justify-content: center;
            }
        }
    </style>
</head>

// ============================================================
// 1. Cookie 工具函数
// ============================================================
var CookieHelper = {
    set: function(name, value, days) {
        var expires = '';
        if (days) {
            var date = new Date();
            date.setTime(date.getTime() + (days * 24 * 60 * 60 * 1000));
            expires = '; expires=' + date.toUTCString();
        }
        document.cookie = name + '=' + encodeURIComponent(value) + expires + '; path=/; SameSite=Lax';
    },
    get: function(name) {
        var nameEQ = name + '=';
        var ca = document.cookie.split(';');
        for (var i = 0; i < ca.length; i++) {
            var c = ca[i];
            while (c.charAt(0) === ' ') c = c.substring(1, c.length);
            if (c.indexOf(nameEQ) === 0) {
                return decodeURIComponent(c.substring(nameEQ.length, c.length));
            }
        }
        return null;
    },
    delete: function(name) {
        document.cookie = name + '=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;';
    },
    getAll: function() {
        var cookies = {};
        var ca = document.cookie.split(';');
        for (var i = 0; i < ca.length; i++) {
            var c = ca[i];
            while (c.charAt(0) === ' ') c = c.substring(1, c.length);
            var eqPos = c.indexOf('=');
            if (eqPos > 0) {
                var name = c.substring(0, eqPos);
                var value = decodeURIComponent(c.substring(eqPos + 1));
                cookies[name] = value;
            }
        }
        return cookies;
    }
};

// 4. 详细错误消息系统
// ============================================================
function showDetailedError(title, detail, suggestion) {
    msgEl.innerHTML = 
        '<span class="error-code">❌ ' + title + '</span>' +
        '<span class="error-detail">' + detail + '</span>' +

// ============================================================
// 5. 连接状态检测
// ============================================================
async function checkConnection() {
    statusDot.className = 'dot checking';
    statusText.textContent = '正在检测服务器连接...';
    
    try {
        // 尝试访问 Worker 的健康检查端点
        var response = await fetch(SUPABASE_URL + '/health', {
            method: 'GET',
            headers: { 'Content-Type': 'application/json' },
            signal: AbortSignal.timeout(5000)
        });
        
        if (response.ok) {
            var data = await response.json();
            statusDot.className = 'dot online';
            statusText.textContent = '✅ 服务器连接正常 (Worker 代理运行中)';
            console.log('✅ 健康检查通过:', data);
            return true;
        } else {
            statusDot.className = 'dot offline';
            statusText.textContent = '⚠️ 服务器响应异常 (HTTP ' + response.status + ')';
            return false;
        }
    } catch (error) {
        statusDot.className = 'dot offline';
        
        if (error.name === 'TimeoutError' || error.name === 'AbortError') {
            statusText.textContent = '⏱️ 连接超时 - 服务器无响应';
        } else if (error.message.includes('Failed to fetch') || error.message.includes('NetworkError')) {
            statusText.textContent = '🌐 网络错误 - 无法连接到服务器';
        } else {
            statusText.textContent = '❌ 连接失败: ' + error.message;
        }
        
        console.error('❌ 连接检测失败:', error);
        return false;
    }
}

// ============================================================
// 6. 错误类型判断函数
// ============================================================
function classifyError(error, context) {
    var message = error.message || String(error);
    
    // 网络/连接错误
    if (message.includes('Failed to fetch') || message.includes('NetworkError') || 
        message.includes('load failed') || message.includes('ERR_CONNECTION_REFUSED')) {
        return {
            title: '🌐 网络连接失败',
            detail: '无法连接到认证服务器，请检查网络连接。',
            suggestion: '请确认网络正常，且代理服务器 ' + SUPABASE_URL + ' 可访问。'
        };
    }
    
    // 超时错误
    if (message.includes('timeout') || message.includes('Timeout')) {
        return {
            title: '⏱️ 请求超时',
            detail: '服务器响应超时，可能网络延迟过高或服务器繁忙。',
            suggestion: '请稍后重试，或检查代理服务器状态。'
        };
    }
    
    // 404 错误
    if (message.includes('404') || message.includes('not found')) {
        return {
            title: '❓ 404 - 接口不存在',
            detail: '代理服务器未正确转发请求到 Supabase。',
            suggestion: '请检查 Worker 代理配置，确保路径转发正确。'
        };
    }
    
    // 500 错误
    if (message.includes('500') || message.includes('Internal Server Error')) {
        return {
            title: '⚠️ 服务器内部错误 (500)',
            detail: '代理服务器或 Supabase 后端出现异常。',
            suggestion: '请检查 Worker 日志，或稍后重试。'
        };
    }
    
    // 403 错误
    if (message.includes('403') || message.includes('Forbidden')) {
        return {
            title: '🔒 403 - 访问被拒绝',
            detail: 'API 密钥无效或权限不足。',
            suggestion: '请检查 SUPABASE_ANON_KEY 是否正确。'
        };
    }
    
    // 401 错误
    if (message.includes('401') || message.includes('Unauthorized')) {
        return {
            title: '🔑 401 - 认证失败',
            detail: '用户名或密码错误，或 token 已过期。',
            suggestion: '请检查用户名和密码是否正确。'
        };
    }
    
    // 422 错误
    if (message.includes('422') || message.includes('Unprocessable Entity')) {
        return {
            title: '📝 422 - 请求数据无效',
            detail: '提交的数据格式不正确。',
            suggestion: '请检查邮箱格式和密码长度是否符合要求。'
        };
    }
    
    // 用户已存在
    if (message.includes('already registered') || message.includes('User already')) {
        return {
            title: '👤 用户已存在',
            detail: '该邮箱已被注册。',
            suggestion: '请直接登录，或使用其他邮箱注册。'
        };
    }
    
    // 密码太弱
    if (message.includes('password') && message.includes('weak')) {
        return {
            title: '🔐 密码强度不足',
            detail: '密码过于简单。',
            suggestion: '请使用至少6位包含字母和数字的密码。'
        };
    }
    
    // 默认
    return {
        title: '⚠️ 请求失败',
        detail: message,
        suggestion: '请稍后重试，如持续失败请联系管理员。'
    };
}

// ============================================================
// 7. 选项卡切换
// ============================================================
document.querySelectorAll('.tab').forEach(function(tab) {
    tab.addEventListener('click', function() {
        document.querySelectorAll('.tab').forEach(function(t) { t.classList.remove('active'); });
        this.classList.add('active');
        var target = this.dataset.tab;
        document.querySelectorAll('.form-panel').forEach(function(p) { p.classList.remove('active'); });
        document.getElementById('panel' + target.charAt(0).toUpperCase() + target.slice(1)).classList.add('active');
        hideMsg();
    });
});

// ============================================================
// 8. 工具函数
// ============================================================
function isEmail(value) {
    return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value);
}

function saveUserSession(userData, remember) {
    var sessionData = {
        isLoggedIn: 'true',
        userId: userData.id || '',
        email: userData.email || '',
        displayName: userData.email ? userData.email.split('@')[0] : '',
        role: userData.role || 'user',
        loginTime: new Date().toISOString()
    };

    sessionStorage.setItem('isLoggedIn', 'true');
    sessionStorage.setItem('userId', sessionData.userId);
    sessionStorage.setItem('userEmail', sessionData.email);
    sessionStorage.setItem('displayName', sessionData.displayName);
    sessionStorage.setItem('role', sessionData.role);

    if (remember) {
        CookieHelper.set('userSession', JSON.stringify(sessionData), 7);
        CookieHelper.set('isLoggedIn', 'true', 7);
        CookieHelper.set('userId', sessionData.userId, 7);
        CookieHelper.set('userEmail', sessionData.email, 7);
        CookieHelper.set('displayName', sessionData.displayName, 7);
        CookieHelper.set('role', sessionData.role, 7);
    } else {
        CookieHelper.set('userSession', JSON.stringify(sessionData), null);
        CookieHelper.set('isLoggedIn', 'true', null);
        CookieHelper.set('userId', sessionData.userId, null);
        CookieHelper.set('userEmail', sessionData.email, null);
        CookieHelper.set('displayName', sessionData.displayName, null);
        CookieHelper.set('role', sessionData.role, null);
    }
}

function clearUserSession() {
    sessionStorage.clear();
    CookieHelper.delete('userSession');
    CookieHelper.delete('isLoggedIn');
    CookieHelper.delete('userId');
    CookieHelper.delete('userEmail');
    CookieHelper.delete('displayName');
    CookieHelper.delete('role');
    CookieHelper.delete('sb-auth-token');
}

// ============================================================
// 9. 登录处理
// ============================================================
loginForm.addEventListener('submit', async function(event) {
    event.preventDefault();
    hideMsg();

    var account = document.getElementById('loginAccount').value.trim();
    var password = document.getElementById('loginPassword').value.trim();
    var remember = rememberMe.checked;

    if (!account || !password) {
        showDetailedError('📝 信息不完整', '请填写完整的登录信息', '请确保用户名和密码都已填写');
        return;
    }

    loginBtn.disabled = true;
    loginBtn.textContent = '登录中...';

    try {
        var email = account;

        if (!isEmail(account)) {
            try {
                var { data: profile, error: profileError } = await supabase
                    .from('profiles')
                    .select('email')
                    .eq('username', account)
                    .maybeSingle();

                if (profileError) {
                    console.warn('查询 profiles 失败:', profileError);
                }

                if (profile && profile.email) {
                    email = profile.email;
                } else {
                    email = account + '@zirui.com';
                }
            } catch (err) {
                console.warn('查询用户出错:', err);
                email = account + '@zirui.com';
            }
        }

        console.log('🔑 尝试登录，邮箱:', email);

        var { data, error } = await supabase.auth.signInWithPassword({
            email: email,
            password: password,
        });

        if (error) {
            var classified = classifyError(error, 'login');
            showDetailedError(classified.title, classified.detail, classified.suggestion);
            loginBtn.disabled = false;
            loginBtn.textContent = '登录';
            return;
        }

        if (data && data.user) {
            saveUserSession({
                id: data.user.id,
                email: data.user.email,
                role: 'user'
            }, remember);

            if (data.session) {
                CookieHelper.set('sb-auth-token', JSON.stringify({
                    access_token: data.session.access_token,
                    refresh_token: data.session.refresh_token,
                    expires_at: data.session.expires_at
                }), remember ? 7 : null);
            }

            showSuccess('✅ 登录成功！正在跳转...');

            setTimeout(function() {
                window.location.href = 'dashboard.html';
            }, 1200);
        } else {
            showDetailedError('⚠️ 登录异常', '服务器返回了空数据', '请稍后重试或联系管理员');
            loginBtn.disabled = false;
            loginBtn.textContent = '登录';
        }

    } catch (err) {
        console.error('登录错误:', err);
        var classified = classifyError(err, 'login');
        showDetailedError(classified.title, classified.detail, classified.suggestion);
        loginBtn.disabled = false;
        loginBtn.textContent = '登录';
    }
});

// 10. 注册处理
// ============================================================
registerForm.addEventListener('submit', async function(event) {
    event.preventDefault();
    hideMsg();

    var account = document.getElementById('regAccount').value.trim();
    var email = document.getElementById('regEmail').value.trim();
    var password = document.getElementById('regPassword').value.trim();
    var confirm = document.getElementById('regConfirm').value.trim();

    if (!account || !email || !password || !confirm) {
        showDetailedError('📝 信息不完整', '请填写完整的注册信息', '所有字段均为必填');
        return;
    }

    if (account.length < 2) {
        showDetailedError('👤 用户名无效', '用户名至少需要2个字符', '建议使用3-16位字母或数字组合');
        return;
    }

    if (!isEmail(email)) {
        showDetailedError('📧 邮箱格式错误', '请输入有效的邮箱地址', '例如: user@example.com');
        return;
    }

    if (password.length < 6) {
        showDetailedError('🔐 密码太短', '密码长度不能少于6位', '建议使用8位以上包含字母和数字的密码');
        return;
    }

    if (password !== confirm) {
        showDetailedError('❌ 密码不匹配', '两次输入的密码不一致', '请重新输入相同的密码');
        return;
    }

    regBtn.disabled = true;
    regBtn.textContent = '注册中...';

    try {
        console.log('📝 注册新用户:', email);

        var { data, error } = await supabase.auth.signUp({
            email: email,
            password: password,
        });

        if (error) {
            var classified = classifyError(error, 'register');
            showDetailedError(classified.title, classified.detail, classified.suggestion);
            regBtn.disabled = false;
            regBtn.textContent = '注册';
            return;
        }

        if (data.user) {
            try {
                var { error: profileError } = await supabase
                    .from('profiles')
                    .insert({
                        id: data.user.id,
                        username: account,
                        email: email,
                        created_at: new Date().toISOString()
                    });

                if (profileError) {
                    console.warn('保存用户名失败:', profileError);
                }
            } catch (e) {
                console.warn('保存用户名出错:', e);
            }

            if (data.session) {
                saveUserSession({
                    id: data.user.id,
                    email: data.user.email,
                    role: 'user'
                }, true);

                CookieHelper.set('sb-auth-token', JSON.stringify({
                    access_token: data.session.access_token,
                    refresh_token: data.session.refresh_token,
                    expires_at: data.session.expires_at
                }), 7);

                showSuccess('✅ 注册成功！正在跳转...');

                setTimeout(function() {
                    window.location.href = 'dashboard.html';
                }, 1500);
            } else {
                showInfo('📧 注册成功！请查收邮箱验证邮件');
                setTimeout(function() {
                    window.location.href = 'login.html';
                }, 3000);
            }
        } else {
            showDetailedError('⚠️ 注册异常', '服务器返回了空数据', '请稍后重试或联系管理员');
            regBtn.disabled = false;
            regBtn.textContent = '注册';
        }

    } catch (err) {
        console.error('注册错误:', err);
        var classified = classifyError(err, 'register');
        showDetailedError(classified.title, classified.detail, classified.suggestion);
        regBtn.disabled = false;
        regBtn.textContent = '注册';
    }
});

// 11. 检查已登录会话
// ============================================================
(function checkSession() {
    var isLoggedIn = CookieHelper.get('isLoggedIn');
    var userSession = CookieHelper.get('userSession');
    
    if (isLoggedIn === 'true' && userSession) {
        try {
            var sessionData = JSON.parse(userSession);
            sessionStorage.setItem('isLoggedIn', 'true');
            sessionStorage.setItem('userId', sessionData.userId || '');
            sessionStorage.setItem('userEmail', sessionData.email || '');
            sessionStorage.setItem('displayName', sessionData.displayName || '');
            sessionStorage.setItem('role', sessionData.role || 'user');
            window.location.href = 'dashboard.html';
            return;
        } catch (e) {
            console.warn('解析用户会话失败:', e);
        }
    }
    
    if (sessionStorage.getItem('isLoggedIn') === 'true') {
        window.location.href = 'dashboard.html';
        return;
    }
    
    if (window.location.hash && window.location.hash.includes('access_token')) {
        supabase.auth.getSession().then(function(result) {
            if (result.data && result.data.session) {
                var user = result.data.session.user;
                saveUserSession({
                    id: user.id,
                    email: user.email,
                    role: 'user'
                }, true);
                setTimeout(function() {
                    window.location.href = 'dashboard.html';
                }, 1000);
            }
        });
    }
})();
